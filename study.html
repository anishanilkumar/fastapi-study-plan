<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="robots" content="noindex, nofollow">
<!-- Installable: "Add to Home Screen" opens it full screen, offline. The
     manifest sits behind the same login as the page, hence use-credentials. -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study">
<title>Study</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect width=%2720%27 height=%2720%27 fill=%27%230a0e14%27/%3E%3Crect x=%275%27 y=%275%27 width=%2710%27 height=%2710%27 fill=%27none%27 stroke=%27%233dd6f5%27 stroke-width=%272%27/%3E%3Crect x=%278%27 y=%278%27 width=%274%27 height=%274%27 fill=%27%233dd6f5%27/%3E%3C/svg%3E">
<style>
/* The "instrument" style: a dark UI built like a machined instrument, not a
   glowing screen. Two accents with jobs (arc blue = live, gold = warning or
   warm), 2px engraved rules, corner brackets instead of boxed cards, no
   shadows or glow, and motion only when something changed. Phone scale: it
   is read at arm's length. Self-checks carry a gold label because they are
   the "do this before moving on" warm signal, not live data.

   Focus mode and the notebook were added for a learner who drifts: focus
   mode hides everything but the one next action and a block timer, and
   highlights are gold because they're the learner's own (warm, human) data. */

@font-face { font-family: "Archivo"; src: url("/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url("/fonts/plexmono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url("/fonts/plexmono-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }

:root {
  --ground: #0a0e14;
  --panel: #111823;
  --panel-lit: #16202e;
  --arc: #3dd6f5;
  --arc-dim: #1d7f96;
  --gold: #e8a33d;
  --alert: #ff4d4d;
  --engrave: #2a3543;
  --ink: #e8f1f8;
  --ink-dim: #7c8fa3;
  --slate: #55647a;
  --slate-dim: #3a4657;

  /* Semantic aliases: components use these, never the raw hues. */
  --synced: var(--arc);
  --unsent: var(--gold);
  /* A highlight's fill: gold at about 18% over the panel, as a solid colour
     so marked code in a <pre> reads the same as marked prose. */
  --mark: #3a2d17;

  --face-data: "Archivo", system-ui, sans-serif;
  --face-mono: "Plex Mono", ui-monospace, "Roboto Mono", monospace;

  --t-major: clamp(1.75rem, 8vw, 2.75rem);
  --t-readout: clamp(1.375rem, 5.5vw, 1.875rem);
  --t-headline: 1.25rem;
  --t-body: 1rem;
  --t-label: 0.8125rem;
  --t-min: 0.75rem;
  --track-label: 0.16em;

  --rule: 2px;
  --gap: 1rem;
  --pad: 1.25rem;
  --bracket: 1rem;
  --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
  color-scheme: dark;
}

/* Server unreachable: swap the tokens wholesale, so no component needs an
   offline branch. The ticks stay visible; the status line says where they live. */
:root[data-connection="offline"] {
  --arc: var(--slate);
  --arc-dim: var(--slate-dim);
  --gold: #8a7350;
  --ink: #b9c4d1;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
/* Components set display, which would otherwise beat the hidden attribute. */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--face-data);
  font-size: var(--t-body);
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }
a { color: var(--arc); text-underline-offset: 3px; }
:focus-visible { outline: var(--rule) solid var(--arc); outline-offset: 2px; }

/* Inline code: a lit panel chip, mono, no rounding beyond 2px. */
code { font-family: var(--face-mono); font-size: 0.875em; background: var(--panel-lit); padding: 0 0.3em; border-radius: 2px; color: var(--ink); }

/* ---- Type roles ---- */
.label { font-family: var(--face-mono); font-size: var(--t-label); font-weight: 500; letter-spacing: var(--track-label); text-transform: uppercase; color: var(--arc-dim); }
.stamp { font-family: var(--face-mono); font-size: var(--t-min); letter-spacing: 0.08em; color: var(--ink-dim); text-transform: uppercase; }
.wordmark { font-family: var(--face-mono); font-weight: 500; font-size: var(--t-label); letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink); }
.readout { font-size: var(--t-readout); font-weight: 500; line-height: 1.05; }

/* ---- Instrument: corner brackets rather than a box ---- */
.instrument { position: relative; background: var(--panel); padding: var(--pad); }
.instrument::before, .instrument::after {
  content: ""; position: absolute; width: var(--bracket); height: var(--bracket);
  border: var(--rule) solid var(--engrave); pointer-events: none;
}
.instrument::before { top: 0; left: 0; border-right: none; border-bottom: none; }
.instrument::after { bottom: 0; right: 0; border-left: none; border-top: none; }

/* ---- Page ---- */
.page {
  max-width: 54rem; margin: 0 auto;
  padding: max(env(safe-area-inset-top), var(--gap)) var(--gap) calc(env(safe-area-inset-bottom) + 4rem);
  display: flex; flex-direction: column; gap: var(--gap);
}
/* Flex children default to min-width:auto, which let the table push the
   page wider than a phone. */
.page > * { min-width: 0; }
.mast { display: grid; gap: 0.75rem; padding: 1.5rem 0 0.5rem; }
.mast-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; justify-content: space-between; }
a.wordmark { text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
a.wordmark:hover { color: var(--arc); }
.mast-row .btn { margin: 0; min-height: 44px; }
/* The course switcher: quiet engraved links, the current one lit. */
.course-links { display: flex; flex-wrap: wrap; gap: 0 1rem; margin-right: auto; }
.course-links a { font-family: var(--face-mono); font-size: var(--t-label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; border-bottom: var(--rule) solid transparent; }
.course-links a:hover { color: var(--arc); }
.course-links a[aria-current] { color: var(--arc); border-bottom-color: var(--arc); }
.course-card { display: grid; gap: 0.75rem; }
.course-card h2 a { color: var(--ink); text-decoration: none; }
.course-card h2 a:hover { color: var(--arc); }
.mast h1 { font-size: var(--t-major); letter-spacing: -0.03em; }
.lede { color: var(--ink-dim); max-width: 60ch; }

/* ---- Progress strip: sticky, so the count is always in reach ---- */
.strip { position: relative; top: 0; z-index: 2; display: grid; gap: 0.75rem; padding-top: calc(var(--pad) + env(safe-area-inset-top)); }
.strip-row { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: flex-end; justify-content: space-between; }
.strip-row > div { display: grid; gap: 0.25rem; }
.readout small { font-size: 0.55em; color: var(--ink-dim); font-weight: 500; }

/* One lit segment per item, like index ticks on a dial: progress you can
   count, not a smooth bar that hides how many are left. */
.ticks { display: flex; gap: 2px; height: 0.625rem; }
.ticks > i { flex: 1; background: var(--engrave); transition: background 220ms var(--ease); }
.ticks > i.on { background: var(--arc); }

.status { display: flex; align-items: center; gap: 0.5rem; min-height: 1.25rem; }
.dot { flex: none; width: 8px; height: 8px; background: var(--synced); }
.status[data-state="syncing"] .dot { animation: blink 0.9s steps(2) infinite; }
.status[data-state="unsent"] .dot { background: var(--unsent); }
.status[data-state="unsent"] .stamp { color: var(--unsent); }
.status[data-state="local"] .dot { background: var(--slate); }
@keyframes blink { 50% { opacity: 0.2; } }
/* Offline readiness: arc when every lesson is on this device, gold while some
   aren't yet, so it can be checked before the connection goes. */
.offline { flex-wrap: wrap; }
.offline[hidden] { display: none; }
.offline[data-state="ready"] .stamp { color: var(--ink-dim); }
.offline[data-state="partial"] .dot { background: var(--gold); }
.offline[data-state="partial"] .stamp { color: var(--gold); }
.offline[data-state="saving"] .dot { animation: blink 0.9s steps(2) infinite; }
.offline .btn { min-height: 44px; padding: 0 0.75rem; }

/* ---- Callout and table ---- */
.callout { background: var(--panel); border-left: 6px solid var(--arc); padding: var(--pad); display: grid; gap: 0.75rem; }
.callout p, .instrument p { max-width: 65ch; }
.section-head { display: grid; gap: 0.375rem; margin-bottom: 1rem; }
.section-head h2 { font-size: var(--t-headline); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 0.625rem 0.75rem 0.625rem 0; vertical-align: top; }
td { border-top: var(--rule) solid var(--engrave); overflow-wrap: anywhere; }
th { padding-bottom: 0.5rem; }

/* ---- Day ---- */
.day-head { display: flex; gap: 0.75rem; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-bottom: 0.5rem; }
.day-head > div { display: grid; gap: 0.375rem; }
.day-head h2 { font-size: var(--t-headline); }
.count[data-full="true"] { color: var(--arc); }
.group-label { padding: 1.25rem 0 0.25rem; }
.group-label.check-label { color: var(--gold); }

ul { list-style: none; }
.item + .item { border-top: var(--rule) solid var(--engrave); }
.item label { display: grid; grid-template-columns: 1.25rem 1fr; gap: 0.875rem; padding: 0.875rem 0; min-height: 64px; cursor: pointer; }

/* Tick box: an engraved square; done fills an inset arc square. No glyph.
   appearance:none keeps it a real checkbox for keyboard and screen readers. */
.item input {
  appearance: none; -webkit-appearance: none; margin: 0.125rem 0 0;
  width: 1.25rem; height: 1.25rem; border: var(--rule) solid var(--arc-dim); border-radius: 0;
  padding: 3px; background-clip: content-box; cursor: pointer;
  transition: background-color 200ms var(--ease);
}
.item input:checked { background-color: var(--arc); border-color: var(--arc); }
.item .copy { display: grid; gap: 0.25rem; }
.item .t { font-weight: 600; font-size: 1.0625rem; line-height: 1.3; transition: color 200ms var(--ease); }
.item label:hover .t { color: var(--arc); }
.item .why { color: var(--ink-dim); max-width: 62ch; }
.item .src { font-size: 0.875rem; }
.item .src a { display: inline-block; padding: 0.25rem 0; }
.item input:checked ~ .copy .t { color: var(--ink-dim); }
.item.check .t::before { content: "Self-check  "; font-family: var(--face-mono); font-size: var(--t-min); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); white-space: pre; }

.foot { padding-top: 1rem; }
.strip-row .right { text-align: right; }
.item .src { display: flex; flex-wrap: wrap; gap: 0 1rem; }
.read-link { font-family: var(--face-mono); font-size: var(--t-min); letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
.read-link:hover { color: var(--ink); }

/* Sticky only on the plan, where ticking is the job. While reading a lesson
   the strip would take a fifth of a phone screen from the text. */
body[data-view="plan"] .strip { position: sticky; }

/* ---- Tabs: mono labels on a 2px engraved rule; the current one is lit. ---- */
.tabs { display: flex; gap: 0.25rem; border-bottom: var(--rule) solid var(--engrave); }
.tabs a {
  display: inline-flex; align-items: center; min-height: 48px; padding: 0 1rem;
  font-family: var(--face-mono); font-size: var(--t-label); font-weight: 500; letter-spacing: var(--track-label); text-transform: uppercase;
  color: var(--ink-dim); text-decoration: none; margin-bottom: calc(-1 * var(--rule));
  border-bottom: var(--rule) solid transparent; transition: color 160ms var(--ease);
}
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--arc); border-bottom-color: var(--arc); }
#view { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
#view > * { min-width: 0; }

/* ---- Syllabus ---- */
.syl-head { padding-top: 0.5rem; margin: 0; }
.tag-extra { color: var(--gold); }
.lessons { list-style: none; }
.lessons > li + li { border-top: var(--rule) solid var(--engrave); }
.lessons a {
  display: grid; grid-template-columns: 0.75rem 1.75rem 1fr auto; gap: 0.75rem; align-items: baseline;
  min-height: 56px; padding: 1rem 0; color: var(--ink); text-decoration: none;
}
.lessons .ltitle { font-weight: 600; font-size: 1.0625rem; line-height: 1.3; transition: color 160ms var(--ease); }
.lessons a:hover .ltitle { color: var(--arc); }
.lessons .meta { text-align: right; white-space: nowrap; }
/* Read marker: the tick box's square, small and not interactive here. */
.lessons .mark { width: 0.75rem; height: 0.75rem; border: var(--rule) solid var(--arc-dim); align-self: center; }
.lessons a[data-read="true"] .mark { background: var(--arc); border-color: var(--arc); }
.lessons a[data-read="true"] .ltitle { color: var(--ink-dim); }
@media (max-width: 520px) {
  .lessons a { grid-template-columns: 0.75rem 1.5rem 1fr; }
  .lessons .meta { grid-column: 3; text-align: left; }
}

/* ---- Lesson ---- */
.back { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; font-family: var(--face-mono); font-size: var(--t-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); text-decoration: none; }
.back:hover { color: var(--arc); }
.lesson-head { display: grid; gap: 0.5rem; padding-bottom: 1.25rem; margin-bottom: 1.25rem; border-bottom: var(--rule) solid var(--engrave); }
.lesson-head h2 { font-size: var(--t-major); letter-spacing: -0.03em; }
.read-done { margin-top: 1.5rem; border-top: var(--rule) solid var(--engrave); }

/* Reading text: a 68ch column, body at 1.0625rem with generous leading,
   because this is the one part of the page meant to be read at length. */
.reading { display: grid; gap: 1rem; font-size: 1.0625rem; line-height: 1.6; }
.reading > * { max-width: 68ch; }
.reading h3 { font-size: var(--t-headline); margin-top: 1rem; }
.reading strong { font-weight: 600; color: var(--ink); }
.reading em { color: var(--ink); }
.reading pre {
  max-width: none; overflow-x: auto; background: var(--ground); border-left: var(--rule) solid var(--arc-dim);
  padding: 0.875rem 1rem; font-family: var(--face-mono); font-size: 0.875rem; line-height: 1.55; tab-size: 4;
}
.reading pre code { background: none; padding: 0; font-size: inherit; color: var(--ink); }
.reading table { display: block; overflow-x: auto; max-width: none; }
.reading td code, .reading th { white-space: nowrap; }
.reading ul.points, .reading ol.points { display: grid; gap: 0.5rem; padding-left: 1.5rem; }
.reading ul.points { list-style: none; }
.reading ul.points li { position: relative; }
.reading ul.points li::before { content: ""; position: absolute; left: -1.125rem; top: 0.7em; width: 0.5rem; height: var(--rule); background: var(--arc-dim); }
.reading ol.points { list-style: decimal; }
.reading ol.points li::marker { font-family: var(--face-mono); color: var(--arc-dim); }
/* Asides are callouts: a thick left rule in the colour of their job.
   bridge from what you know (PHP, HTTP, NATS) = arc (live, the thing to connect to); trap = gold (warning);
   try-it = ink; further reading = engraved, the quietest. */
.reading aside { display: grid; gap: 0.5rem; background: var(--panel-lit); border-left: 6px solid var(--engrave); padding: 1rem 1.125rem; }
.reading aside.php, .reading aside.bridge { border-left-color: var(--arc); }
.reading ul.map { list-style: none; display: grid; gap: 0; margin: 0; padding: 0; }
.reading ul.map li { display: grid; gap: 0.125rem; padding: 0.5rem 0; border-top: var(--rule) solid var(--engrave); }
.reading ul.map li::before { content: none; }
.reading ul.map .to { color: var(--ink-dim); }
.reading aside.trap { border-left-color: var(--gold); }
.reading aside.trap .label { color: var(--gold); }
.reading aside.try { border-left-color: var(--ink-dim); }
.reading aside.try .label { color: var(--ink); }
.reading aside.more ul { display: grid; gap: 0.25rem; }
.reading aside.more a { display: inline-block; padding: 0.25rem 0; }

/* Loading: a page-shaped placeholder in slate, not a spinner. */
.placeholder { display: grid; gap: 0.75rem; }
.placeholder i { display: block; height: 1rem; background: var(--slate-dim); opacity: 0.5; }
.placeholder i.short { width: 60%; }
.empty { display: grid; gap: 0.75rem; justify-items: start; color: var(--ink-dim); }
.empty .label { color: var(--slate); }
.btn {
  display: inline-flex; align-items: center; min-height: 48px; padding: 0 1.25rem; border: var(--rule) solid var(--engrave); border-radius: 2px;
  background: transparent; color: var(--ink); font-family: var(--face-mono); font-size: var(--t-label); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
}
.btn:hover { background: var(--engrave); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.pager a { display: grid; gap: 0.25rem; align-content: start; min-height: 64px; padding: 1rem 0; border-top: var(--rule) solid var(--engrave); color: var(--ink); text-decoration: none; font-weight: 600; }
.pager a:hover { color: var(--arc); }
.pager a.next { text-align: right; }

/* ==== The game layer. Same language as the rest: numbers that move, ticks
   that light, brackets. No confetti, glow or bounce; a reward is a readout
   changing and one mechanical blink. ==== */
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.strip-row { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; align-items: end; }
.strip-row .stamp { display: block; margin-top: 0.125rem; }
@media (max-width: 640px) { .strip-row { grid-template-columns: 1fr 1fr; gap: 1rem; } .strip-row .right { text-align: left; } }
.today { display: flex !important; align-items: center; gap: 0.75rem; }
.today > div { display: grid; gap: 0.25rem; }
.dial { width: 3rem; height: 3rem; flex: none; }
.dial line { stroke: var(--engrave); stroke-width: 2.5; stroke-linecap: butt; transition: stroke 220ms var(--ease); }
.dial line.on { stroke: var(--arc-dim); }
.dial.full line.on { stroke: var(--arc); }
@media (max-width: 480px) { .tabs a { flex: 1 1 auto; justify-content: center; padding: 0 0.25rem; letter-spacing: 0.08em; } }
.tabs a span { margin-left: 0.5rem; color: var(--slate); letter-spacing: 0.04em; }
.tabs a[aria-current="page"] span { color: var(--arc-dim); }

/* Next up: the one action to take. Arc callout, the page's only primary button. */
.next { gap: 0.625rem; }
.next h2 { font-size: var(--t-headline); }
.next .btn { justify-self: start; margin-top: 0.25rem; text-decoration: none; }
.btn-primary { background: var(--arc); border-color: var(--arc); color: var(--ground); }
.btn-primary:hover { background: var(--ink); border-color: var(--ink); }
a.btn { text-decoration: none; }

/* A plan row reached from "Go to it" lights once, then settles. */
.item.flash { animation: flash 1.2s steps(2) 2; }
@keyframes flash { 50% { background: var(--panel-lit); } }

/* ---- Check ---- */
.quiz .q { border: 0; display: grid; gap: 0.75rem; padding: 1rem 0; }
.quiz .q + .q { border-top: var(--rule) solid var(--engrave); }
.quiz legend { font-weight: 600; font-size: 1.0625rem; line-height: 1.35; padding: 0 0 0.75rem; }
.quiz legend .stamp { margin-right: 0.5rem; }
.opts { display: grid; gap: 0.5rem; }
.opt {
  text-align: left; min-height: 48px; padding: 0.625rem 1rem; background: transparent; border: var(--rule) solid var(--engrave); border-radius: 2px;
  font-size: 1rem; line-height: 1.4; cursor: pointer; transition: background 160ms var(--ease), border-color 160ms var(--ease);
}
.opt:hover:not(:disabled) { background: var(--panel-lit); border-color: var(--arc-dim); }
.opt:disabled { cursor: default; }
.opt[data-state="right"] { border-color: var(--arc); color: var(--ink); animation: blink-once 0.4s steps(2) 1; }
.opt[data-state="wrong"] { border-color: var(--gold); color: var(--ink-dim); }
.opt[data-state="dim"] { opacity: 0.45; }
@keyframes blink-once { 50% { background: var(--panel-lit); } }
.verdict { background: var(--panel-lit); border-left: 6px solid var(--arc); padding: 0.75rem 1rem; color: var(--ink-dim); }
.verdict[data-ok="false"] { border-left-color: var(--gold); }
.verdict[data-ok="false"] .label { color: var(--gold); }
.verdict[data-ok="true"] .label { color: var(--arc); }
.result { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; padding-top: 1rem; border-top: var(--rule) solid var(--engrave); }
.qscore[data-pass="true"] { color: var(--arc); }

/* ---- Record ---- */
.section-head .rank-name { font-size: var(--t-major); letter-spacing: -0.03em; }
.ladder, .badges, .rules { list-style: none; }
.ladder li { display: grid; grid-template-columns: 0.75rem 1fr auto; gap: 0.75rem; align-items: center; min-height: 44px; }
.ladder li + li, .rules li + li { border-top: var(--rule) solid var(--engrave); }
.ladder .mark, .badges .mark { width: 0.75rem; height: 0.75rem; border: var(--rule) solid var(--arc-dim); }

<div id="root"></div>
<script>
(function () {
  // ---- Config, injected by the server from config.json (see

  var CONFIG = /*STUDY_CONFIG*/null || {};

  var DEMO = !!CONFIG.demo;

  var MENTOR = CONFIG.mentor || null;

    var h = '<header class="mast"><div class="mast-row"><a class="wordmark" href="' + esc(HOME) + '">Study' + (MENTOR ? " · progress report" : "") + "</a></div>" +
      "<h1>" + esc(CONFIG.title || "Study") + "</h1>" +
      '<p class="lede">' + (MENTOR ? "A read-only view of the learner's progress in each course. Open one for the detail." :
        "Pick a course. Each keeps its own progress, XP, goal and deadline; lessons, checks, drills and notes work the same way in all of them.") + "</p>" +
      (DEMO ? '<p class="demo-note"><span class="label">Demo</span> Your progress stays in this browser; nothing is sent to the server.</p>' : "") + "</header>";
    home.courses.forEach(function (c) {
      var lit = c.lessons ? Math.round(20 * c.read / c.lessons) : 0, ticks = "";
      for (var i = 0; i < 20; i++) ticks += i < lit ? '<i class="on"></i>' : "<i></i>";
      var started = c.read || c.passed || c.drills_done;
      h += '<section class="instrument course-card"><div class="section-head"><span class="label">' + esc(c.short) + " · " + c.lessons + " lessons · " + c.drills + " drills · about " + c.hours + " h</span>" +
        '<h2><a href="' + esc(c.href) + '">' + esc(c.title) + " ›</a></h2>" + '<p class="why">' + esc(c.blurb) + "</p></div>" +
        '<div class="ticks" aria-hidden="true">' + ticks + "</div>" +
        '<span class="stamp">' + (DEMO ? "Progress is kept in this browser" : started ? c.read + " of " + c.lessons + " read · " + c.passed + " checks passed · " + c.drills_done + " drills done" +
          (c.updated_at ? " · last change " + esc(new Date(c.updated_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })) : "") : "Not started") + "</span>" +
        '<div class="next-actions"><a class="btn' + (started || MENTOR ? "" : " btn-primary") + '" href="' + esc(c.href) + '">' + (MENTOR ? "Open the report" : started ? "Carry on" : "Start") + " ›</a></div></section>";
    });

    if (!MENTOR && "serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("/sw.js").catch(function () {});

  // ---- The course: its plan, syllabus, ranks and texts, from
  // courses/<id>/course.json, injected by the server with the config. ----
  var COURSE = CONFIG.course || { id: "none", title: "No course", plan: [], parts: [], ranks: [{ xp: 0, t: "Novice", need: [] }] };
  // Where this course's files are: /<id>/quizzes.json, /<id>/lessons/<id>.html, /<id>/state.
  var BASE = "/" + COURSE.id + "/";
  var PLAN = COURSE.plan, PARTS = COURSE.parts;
  var TARGET = CONFIG.target ? { label: CONFIG.target.label, at: new Date(CONFIG.target.at) } : null;
  var START = CONFIG.start ? new Date(CONFIG.start + "T12:00:00") : null;
  var TITLE = COURSE.title;
  function planDate(n) { var t = new Date(START); t.setDate(t.getDate() + n); return t; }
  function dayLabel(d) {
    var base = START ? planDate(d.n).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "Day " + (d.n + 1);
    return base + (d.part ? ", " + d.part : "");

    }

  }

  // The single next thing to do. Due reviews first (they're short and they
  // fix what you got wrong), then in plan order: read the lesson behind the
  // next unticked item, pass its check, tick the item.
  // ==== Today: what fits in the time you have, best first. ====
  // You say how long you have (kept per device, for today only). The list is
  // rebuilt from what's left every time anything changes, so finishing early
  // pulls more in and overrunning drops the last things off. Breaks count:
  // 25 minutes on, 5 off, so only five sixths of the time is work.
  var TKEY = LS + "-today";
  function todayUntil() {
    try { var v = JSON.parse(localStorage.getItem(TKEY) || "null"); return v && v.date === today() ? v.until : null; } catch (e) { return null; }
  }
  function setTodayUntil(ms) {
    try { if (ms) localStorage.setItem(TKEY, JSON.stringify({ date: today(), until: ms })); else localStorage.removeItem(TKEY); } catch (e) {}
  }
  function todayBudget() { var u = todayUntil(); return u ? Math.max(0, (u - Date.now()) / 60000 * 5 / 6) : null; }
  function lessonLeft(l) {
    var items = allItems().filter(function (i) { return i.lesson === l.id && !state.done[i.id]; });
    var read = !!state.done[readId(l.id)], ok = passed(l.id);
    var min = (read ? 0 : l.min) + (ok ? 0 : EST.check) + items.reduce(function (a, i) { return a + itemMin(i, false); }, 0);
    var steps = (read ? [] : ["read " + l.min + " min"]).concat(ok ? [] : ["check"]).concat(items.length ? [items.length + " plan item" + (items.length === 1 ? "" : "s")] : []);
    var href = !read ? "#/lesson/" + l.id : !ok ? "#/lesson/" + l.id + "/check" : items.length ? "#/plan/" + items[0].id : "#/lesson/" + l.id;
    return { min: min, steps: steps, href: href, read: read, ok: ok, items: items, started: read || ok || items.length < allItems().filter(function (i) { return i.lesson === l.id; }).length };
  }
  function todayTasks(budget) {
    var cands = [], t = today();
    var due = dueReviews().length;
    if (due) cands.push({ kind: "Review", t: due + " missed question" + (due === 1 ? "" : "s"), min: Math.max(2, due), href: "#/review", act: { kind: "review", n: due } });
    var planLessons = LESSONS.filter(function (l) { return l.day; });
    var open = planLessons.map(function (l) { return [l, lessonLeft(l)]; }).filter(function (p) { return p[1].min > 0; });
    var lessonTask = function (p) {
      var l = p[0], x = p[1];
      return { kind: "Lesson", t: l.title, sub: x.steps.join(" · "), min: x.min, href: x.href, lesson: l.id,
        act: !x.read ? { kind: "read", lesson: l } : !x.ok ? { kind: "check", lesson: l } : { kind: "tick", item: x.items[0] } };
    };
    var drillTask = function (d) { return { kind: "Drill", t: d.title, min: d.minutes + EST.drillExtra, href: "#/drill/" + d.id, after: d.after, act: { kind: "drill", drill: d } }; };
    var undone = (drills || []).filter(function (d) { return !drillTried(d); });
    // Lessons read and passed with only plan ticks left: one task, not one each.
    var tickOnly = open.filter(function (p) { return p[1].read && p[1].ok; });
    if (tickOnly.length) {
      var ti = [].concat.apply([], tickOnly.map(function (p) { return p[1].items; }));
      cands.push({ kind: "Plan items", t: "Tick " + ti.length + " plan item" + (ti.length === 1 ? "" : "s") + " from lessons you've done", sub: "Each is a one-line check that you can explain it",
        min: ti.reduce(function (a, i) { return a + itemMin(i, false); }, 0), href: "#/plan/" + ti[0].id, act: { kind: "tick", item: ti[0] } });
    }
    open = open.filter(function (p) { return !(p[1].read && p[1].ok); });
    // Started lessons first: finishing them is cheap and the reading is fresh.
    open.filter(function (p) { return p[1].started; }).forEach(function (p) { cands.push(lessonTask(p)); });
    undone.filter(drillReady).forEach(function (d) { cands.push(drillTask(d)); });
    open.filter(function (p) { return !p[1].started; }).forEach(function (p) {
      cands.push(lessonTask(p));
      undone.filter(function (d) { return d.after === p[0].id; }).forEach(function (d) { cands.push(drillTask(d)); });
    });
    LESSONS.forEach(function (l) {
      var st = lessonStats(l.id);
      if (st.n >= 3 && st.ok / st.n < 0.6) cands.push({ kind: "Quiz", t: l.title + " (" + pct(st.ok, st.n) + "% so far)", min: 8, href: "#/quiz/" + l.id, act: { kind: "quiz", scope: l.id, label: l.title } });
    });
    PLAN.forEach(function (d) {
      if (START && dayKey(planDate(d.n)) > t) return;           // later days wait for their day
      dayItems(d).forEach(function (i) {
        if (!i.lesson && !state.done[i.id] && i.min !== 0) cands.push({ kind: "Plan item", t: i.t, html: true, min: itemMin(i, d.checks.indexOf(i) >= 0), href: "#/plan/" + i.id, act: { kind: "tick", item: i } });
      });
    });
    // Pick in order. Lessons keep the plan's order: once one doesn't fit,
    // later ones (and their drills) wait for tomorrow. Others fill gaps.
    var picked = [], used = 0, lessonStop = false, skipped = 0, skippedMin = 0;
    cands.forEach(function (c) {
      var blocked = (c.kind === "Lesson" && lessonStop) || (c.after && !state.done[readId(c.after)] && !picked.some(function (p) { return p.lesson === c.after; }));
      if (!blocked && used + c.min <= budget) { picked.push(c); used += c.min; }
      else { if (c.kind === "Lesson") lessonStop = true; skipped++; skippedMin += c.min; }
    });
    // Time to spare: quiz rounds on what you've read.
    while (budget - used >= 8 && lessonsRead().length && picked.filter(function (p) { return p.kind === "Quiz round"; }).length < 3) {
      picked.push({ kind: "Quiz round", t: "10 questions on what you've read", min: 8, href: "#/quiz/mix", act: { kind: "quiz", scope: "mix", label: "a quiz round" } }); used += 8;
    }
    return { picked: picked, used: used, skipped: skipped, skippedMin: skippedMin };
  }
  function todayHtml() {
    if (MENTOR) return "";
    var until = todayUntil(), b = todayBudget(), now = new Date();
    var chips = [[60, "1 h"], [120, "2 h"], [180, "3 h"]].map(function (x) { return '<button type="button" class="chip" data-act="today-set" data-min="' + x[0] + '">' + x[1] + "</button>"; }).join("");
    var bed = new Date(); bed.setHours(SLEEP, 0, 0, 0);

        '<div class="chips" role="group" aria-label="Time today">' + chips + "</div></section>";
    }

      '<span class="stamp">Until ' + esc(untilD.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })) + ", breaks taken out · " + num(score().today) + ' XP today · <button type="button" class="linkish" data-act="today-change">change</button></span></div>';
    if (b < 5) return h + '<p class="why">Stop here. Rest is part of it.</p><div class="chips">' + chips + "</div></section>";
    if (!r.picked.length) h += '<p class="why">Nothing left that fits. Take a break, or pick more time.</p>';
    h += '<ol class="today-list">' + r.picked.map(function (c, i) {
      return '<li><span class="stamp">' + esc(c.kind) + " · " + Math.round(c.min) + " min</span>" +

        (c.sub ? '<span class="why">' + esc(c.sub) + "</span>" : "") + "</li>";
    }).join("") + "</ol>";
    if (r.skipped) h += '<p class="stamp today-left">Not today: ' + r.skipped + " thing" + (r.skipped === 1 ? "" : "s") + ", about " + hm(r.skippedMin) + ". Optional lessons and extra questions aren't counted.</p>";
    return h + '<div class="chips today-change" hidden>' + chips + '<button type="button" class="chip" data-act="today-clear">Clear</button></div></section>';
  }

  function nextAction() {
    // With a time set for today, Next up is the top of today's list.
    var tb = todayBudget();
    if (tb != null && tb >= 5) { var tt = todayTasks(tb).picked[0]; if (tt) return tt.act; }
    var due = dueReviews().length;
    if (due) return { kind: "review", n: due };
    var pd = pendingDrill();
    if (pd) return { kind: "drill", drill: pd };
    var items = allItems();
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (state.done[it.id]) continue;
      var l = it.lesson && BY_ID[it.lesson];
      if (l && !state.done[readId(l.id)]) return { kind: "read", lesson: l, item: it };
      if (l && !passed(l.id)) return { kind: "check", lesson: l, item: it };
      return { kind: "tick", item: it };
    }
    var extra = LESSONS.filter(function (l) { return !state.done[readId(l.id)] || !passed(l.id); })[0];
    if (extra) return { kind: state.done[readId(extra.id)] ? "check" : "read", lesson: extra };
    return null;
  }

    if (a.kind === "tick") {

      var blocked = nextR.need.filter(function (n) { return !n[1](s); }).length + (s.xp < nextR.xp ? 1 : 0);
      h += '<div class="section-head" id="next-rank"><span class="label">What stands between you and ' + esc(nextR.t) + "</span>" +
        '<span class="stamp">' + (blocked ? blocked + " thing" + (blocked === 1 ? "" : "s") + " left" : "Everything met") + "</span></div><ul class=\"need\">" +
        '<li data-ok="' + (s.xp >= nextR.xp) + '"><span class="mark" aria-hidden="true"></span><span>' + num(nextR.xp) + " XP" +
        '<span class="stamp need-say">' + (s.xp >= nextR.xp ? "Done · " + num(s.xp) + " XP" : num(nextR.xp - s.xp) + " to go: every tick, lesson, check and drill earns some") + "</span></span></li>" +
        nextR.need.map(function (n) {
          var ok = n[1](s), td = !ok && n[2] ? n[2](s) : null, go = td ? td.go : [];
          return '<li data-ok="' + ok + '"><span class="mark" aria-hidden="true"></span><span>' + esc(n[0]) + '<span class="visually-hidden">' + (ok ? " (done)" : " (not yet)") + "</span>" +
            (td ? '<span class="stamp need-say">' + esc(td.say) + "</span>" : ok ? '<span class="stamp need-say">Done</span>' : "") +
            (go.length ? '<span class="need-go">' + go.slice(0, 5).map(function (g, gi) {
              return '<a href="' + g[1] + '"' + (gi === 0 ? ' class="first"' : "") + ">" + esc(g[0]) + " ›</a>";
            }).join("") + (go.length > 5 ? '<span class="stamp">and ' + (go.length - 5) + " more after these</span>" : "") + "</span>" : "") +
            "</span></li>";
        }).join("") + "</ul>";
    }
    h += '<ol class="ladder">' + RANKS.map(function (x, i) {
        return '<li data-state="' + (i < r ? "past" : i === r ? "now" : "ahead") + '"><span class="mark"></span><span class="ltitle">' + esc(x.t) +
          (x.need.length ? '<span class="why">' + x.need.map(function (n) { return esc(n[0]); }).join(" · ") + "</span>" : "") + '</span><span class="stamp">' + num(x.xp) + " XP</span></li>";
      }).join("") + "</ol></section>";
    var stats = [
      ["Plan items", s.planDone + " / " + allIds().length],
      ["Lessons read", s.read + " / " + LESSONS.length],
      ["Checks passed", s.passed + " / " + LESSONS.length],
      ["Full marks", String(s.perfect)],
      ["Bugs found", String(s.found)],
      ["Focus blocks", s.blocks + (s.blocksToday ? " · " + s.blocksToday + " today" : "")],
      ["To review", s.pending ? s.due + " due · " + s.pending : "0"],
      ["Streak", s.streak + " d"],
      ["Best day", num(s.bestDay) + " XP"]
    ];
    h += '<section class="instrument"><div class="section-head"><span class="label">Stats</span></div><dl class="stats">' +
      stats.map(function (x) { return '<div><dt class="label">' + x[0] + '</dt><dd class="readout">' + x[1] + "</dd></div>"; }).join("") + "</dl>" +
      (s.due ? '<a class="btn" href="#/review">Review ' + s.due + " due ›</a>" : "") + "</section>";
    h += '<section class="instrument"><div class="section-head"><span class="label">Badges · ' + s.badges.length + " of " + BADGES.length + '</span></div><ul class="badges">' +
      BADGES.map(function (b) {
        var on = s.badges.indexOf(b.id) >= 0;
        return '<li data-on="' + on + '"><span class="mark" aria-hidden="true"></span><span class="ltitle">' + esc(b.t) + '</span><span class="why">' + esc(b.d) + "</span>" + (on ? "" : '<span class="visually-hidden">(locked)</span>') + "</li>";
      }).join("") + "</ul></section>";
    if (!MENTOR) h += setupHtml(false);
    if (CONFIG.mentor_path && !MENTOR) {
      h += '<section class="instrument"><div class="section-head"><span class="label">Share with your mentor</span>' +
        '<p class="why">A read-only link: your progress, scores, drills, highlights and notes, but not your parked thoughts. No login needed, so share it only with them. To revoke it, change <code>mentor_token</code> in config.json and redeploy.</p></div>' +
        '<div class="mentor-link"><input class="field" id="mentor-url" readonly value="' + esc(location.origin + CONFIG.mentor_path) + '" aria-label="Mentor link"><button type="button" class="btn" data-act="copy-mentor">Copy</button></div></section>';
    }
    var rule = function (a, b) { return "<li><span>" + a + '</span><span class="stamp">' + b + "</span></li>"; };
    h += '<section class="instrument"><div class="section-head"><span class="label">How XP works</span></div><ul class="rules">' +
      rule("Tick a plan item", "+" + XP.tick) + rule("Read a lesson", "+" + XP.read) +
      rule("Each correct answer in a check (best attempt counts)", "+" + XP.correct) + rule("Full marks on a check", "+" + XP.perfect) +
      rule("A missed question, answered right on review", "+" + XP.cleared) +
      rule("Each bug you found in a drill", "+" + XP.finding) + rule("Finding a drill's worst bug", "+" + XP.worst) +
      rule("A finished focus block (in focus mode)", "+" + XP.block) +
      rule("A quiz-only question right for the first time", "+" + XP.extra) +
      rule("Unticking takes the XP back", "−") + "</ul></section>";
    return h;
  }

  function lessonHtml(l) {
    var i = LESSONS.indexOf(l), prev = LESSONS[i - 1], next = LESSONS[i + 1];
    var covers = [];
    PLAN.forEach(function (d) { dayItems(d).forEach(function (it) { if (it.lesson === l.id) covers.push(it); }); });
    var h = '<a class="back" href="#/syllabus">‹ Syllabus</a>';
    h += '<article class="instrument lesson"><header class="lesson-head"><span class="label">Part ' + l.part.n + " · " + esc(l.part.title) + " · Lesson " + (i + 1) + " of " + LESSONS.length + "</span>" +
      "<h2>" + esc(l.title) + '</h2><span class="stamp">' + l.min + " min reading · " + (l.day ? "Plan: " + esc(shortDay(l.day)) : "Extra, not in the plan") + " · +" + XP.read + " XP</span></header>" +
      '<div class="reading" id="reading" aria-busy="true"><div class="placeholder"><i></i><i></i><i></i><i class="short"></i></div></div>' +
      '<div class="lesson-notes"><label class="notes"><span class="label">Your notes</span>' +

      '<span class="stamp">Select any text above to highlight it · tap a highlight to write a note on it · find it all later under Notes</span></div>' +
      '<ul class="read-done">' + itemHtml({ id: readId(l.id), t: "I've read this" }, false, true) + "</ul></article>";
    h += '<div data-ldrills="' + l.id + '"></div>';
    h += '<section class="instrument quiz" id="check"><div class="day-head"><div><span class="label">Check · 3 questions</span><h2>What stuck?</h2></div><span class="stamp" id="qbest"></span></div><div id="quiz"></div></section>';
    if (covers.length) {
      h += '<section class="instrument"><div class="section-head"><span class="label">In the plan</span><h2>Items this lesson covers</h2></div><ul>' +
        covers.map(function (it) { return itemHtml(it, false, true); }).join("") + "</ul></section>";
    }
    h += '<nav class="pager">' +
      (prev ? '<a href="#/lesson/' + prev.id + '"><span class="stamp">‹ Previous</span><span>' + esc(prev.title) + "</span></a>" : "<span></span>") +
      (next ? '<a class="next" href="#/lesson/' + next.id + '"><span class="stamp">Next ›</span><span>' + esc(next.title) + "</span></a>" : "<span></span>") + "</nav>";
    return h;
  }

  function loadLesson(l) {
    var box = document.getElementById("reading");
    function show(html, text) { box.innerHTML = html; box.removeAttribute("aria-busy"); if (text) applyMarks(l.id); }
    if (lessonCache[l.id]) { show(lessonCache[l.id], true); return; }
    fetch(BASE + "lessons/" + l.id + ".html").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function (html) {
      lessonCache[l.id] = html;
      if (route === "lesson/" + l.id) show(html, true);
    }).catch(function () {
      if (route !== "lesson/" + l.id) return;
      show('<div class="empty"><span class="label">Reading unavailable</span><p>The lesson text comes from the server, which can\'t be reached, and this lesson isn\'t in the offline cache yet.</p><button class="btn" type="button" id="retry-lesson">Try again</button></div>');
      document.getElementById("retry-lesson").onclick = function () { box.setAttribute("aria-busy", "true"); loadLesson(l); };
    });
  }

  // ---- Questions: shared by lesson checks and the review list ----
  // Options are shuffled with a seed from the lesson and question, so the
  // order is stable between visits but the right answer isn't always B.
  function shuffled(n, seed) {
    var h = 2166136261; for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var idx = []; for (var j = 0; j < n; j++) idx.push(j);
    for (var k = n - 1; k > 0; k--) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; var r = h % (k + 1); var t = idx[k]; idx[k] = idx[r]; idx[r] = t; }
    return idx;
  }
  function questionHtml(q, key, picked, head) {
    var order = shuffled(q[1].length, key.replace(".", ":")), h = "";
    h += '<fieldset class="q" data-done="' + (picked != null) + '"><legend>' + head + " " + codeish(q[0]) + '</legend><div class="opts">';
    order.forEach(function (oi) {
      var st = picked == null ? "" : oi === q[2] ? "right" : oi === picked ? "wrong" : "dim";
      h += '<button type="button" class="opt" data-key="' + key + '" data-o="' + oi + '"' + (st ? ' data-state="' + st + '"' : "") + (picked != null ? " disabled" : "") + ">" + codeish(q[1][oi]) + "</button>";
    });
    h += "</div>";
    if (picked != null) h += '<p class="verdict" data-ok="' + (picked === q[2]) + '"><span class="label">' + (picked === q[2] ? "Right" : "Not quite") + "</span> " + codeish(q[3]) + "</p>";
    return h + "</fieldset>";
  }

  function loadJson(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }); }
  function loadQuizzes() { return quizzes ? Promise.resolve(quizzes) : loadJson(BASE + "quizzes.json").then(function (q) { return (quizzes = q); }); }
  function loadDrills() { return allDrills ? Promise.resolve(allDrills) : loadJson(BASE + "drills.json").then(function (d) { setDrills(d); updateCounts(); return d; }); }

  function renderQuiz(l) {
    var box = document.getElementById("quiz"); if (!box) return;
    var best = state.quiz[l.id];
    document.getElementById("qbest").textContent = best ? "Best " + best.best + " / " + best.of : "Not taken";
    loadQuizzes().then(function (all) {
      if (route !== "lesson/" + l.id || !document.getElementById("quiz")) return;
      var qs = (all[l.id] || []).slice(0, CHECK_N), run = quizRuns[l.id] || (quizRuns[l.id] = qs.map(function () { return null; }));
      var h = qs.map(function (q, qi) { return questionHtml(q, l.id + "." + qi, run[qi], '<span class="stamp">' + (qi + 1) + " / " + qs.length + "</span>"); }).join("");
      if (qs.length && run.every(function (x) { return x !== null; })) {
        var got = run.filter(function (x, i) { return x === qs[i][2]; }).length;
        h += '<div class="result"><span class="readout">' + got + " <small>/ " + qs.length + "</small></span><span class=\"stamp\">" +
          (got === qs.length ? "Full marks" : got >= qs.length - 1 ? "Passed. Full marks earns +" + XP.perfect : "Not passed yet: " + (qs.length - 1) + " needed. Reread the traps and try again") +
          (got < qs.length ? " · misses come back for review tomorrow" : "") +
          '</span><button type="button" class="btn" id="quiz-retry">Try again</button></div>';
      }
      box.innerHTML = h;
      box.onclick = function (ev) {
        var b = ev.target.closest(".opt"); if (b) answer(l, qs, +b.dataset.key.split(".")[1], +b.dataset.o);
        if (ev.target.id === "quiz-retry") { quizRuns[l.id] = null; renderQuiz(l); document.getElementById("check").scrollIntoView({ block: "start" }); }
      };
    }).catch(function () {
      if (route === "lesson/" + l.id) box.innerHTML = '<div class="empty"><span class="label">Check unavailable</span><p>The questions come from the server, which can\'t be reached.</p></div>';
    });
  }

  function answer(l, qs, qi, oi) {
    var run = quizRuns[l.id]; if (run[qi] !== null) return;
    run[qi] = oi;
    // A miss goes on the review list for tomorrow: spaced, not crammed.
    change(function () { record(l.id + "." + qi, oi === qs[qi][2]); if (oi !== qs[qi][2]) state.review[l.id + "." + qi] = tomorrow(); });
    if (run.every(function (x) { return x !== null; })) {
      var got = run.filter(function (x, i) { return x === qs[i][2]; }).length, prev = state.quiz[l.id];
      if (!prev || got > prev.best) {
        change(function () {
          state.quiz[l.id] = { best: got, of: qs.length };
          // Passing a check is proof of reading, so it ticks "read" too.
          if (got >= qs.length - 1) state.done[readId(l.id)] = true;
        }, got === qs.length ? "Full marks · " + l.title : "Check · " + l.title);
        var cb = document.querySelector('input[data-id="' + readId(l.id) + '"]'); if (cb) cb.checked = !!state.done[readId(l.id)];
      }
    }
    renderQuiz(l);
  }

  // ---- Review: yesterday's misses. Right clears it; wrong brings it back
  // tomorrow. ----
  function reviewHtml() {
    return '<a class="back" href="#/plan">‹ Plan</a><section class="instrument quiz"><div class="day-head"><div><span class="label">Review</span><h2>Questions you missed</h2></div><span class="stamp" id="rv-count"></span></div><div id="review"><div class="placeholder"><i></i><i></i><i class="short"></i></div></div></section>';
  }
  function renderReview() {
    var box = document.getElementById("review"); if (!box) return;
    loadQuizzes().then(function (all) {
      if (route !== "review") return;
      // Keep questions answered this visit on screen, with their verdicts.
      var keys = dueReviews().concat(Object.keys(reviewRun).filter(function (k) { return dueReviews().indexOf(k) < 0; })).sort();
      keys = keys.filter(function (k) { var p = k.split("."); return all[p[0]] && all[p[0]][+p[1]]; });
      var left = dueReviews().length, later = Object.keys(state.review).length - left;
      document.getElementById("rv-count").textContent = left + " due" + (later ? " · " + later + " later" : "");
      if (!keys.length) {
        box.innerHTML = '<div class="empty"><span class="label">Nothing due</span><p>' + (later ? later + " question" + (later === 1 ? " comes" : "s come") + " back tomorrow." : "Questions you miss in a check land here the next day.") + '</p><a class="btn" href="#/plan">Back to the plan</a></div>';
        return;
      }
      box.innerHTML = keys.map(function (k) {
        var p = k.split("."), l = BY_ID[p[0]];
        return questionHtml(all[p[0]][+p[1]], k, reviewRun[k], '<span class="stamp">' + esc(l ? l.title : p[0]) + "</span>");
      }).join("");
      box.onclick = function (ev) {
        var b = ev.target.closest(".opt"); if (!b) return;
        var k = b.dataset.key, p = k.split("."), q = all[p[0]][+p[1]], oi = +b.dataset.o;
        if (reviewRun[k] != null) return;
        reviewRun[k] = oi;
        if (oi === q[2]) change(function () { record(k, true); delete state.review[k]; state.cleared = (state.cleared || 0) + 1; }, "Cleared · " + (BY_ID[p[0]] || {}).title);
        else change(function () { record(k, false); state.review[k] = tomorrow(); });
        renderReview();
      };
    }).catch(function () {
      box.innerHTML = '<div class="empty"><span class="label">Review unavailable</span><p>The questions come from the server, which can\'t be reached.</p></div>';
    });
  }

  // ==== Deadline: how much work is left, in minutes, against how much
  // usable time is left. Estimates, and labelled as such: each lesson's
  // reading time, plus a few minutes per check, plan item and drill.
  // Usable time is 07:00-23:00; nights don't count. ====
  var WAKE = 7, SLEEP = 23;
  var EST = { check: 3, selfCheck: 5, linked: 2, item: 10, drillExtra: 5, extraQ: 0.75, review: 0.5 };
  function deadline() {
    var v = state.deadline || CONFIG.finish_by, t = v ? new Date(v) : null;
    return t && !isNaN(t) ? t : null;
  }
  function awake(a, b) {
    if (!(b > a)) return 0;
    var t = 0, day = new Date(a); day.setHours(0, 0, 0, 0);
    while (day < b) {
      var s = new Date(day), e = new Date(day); s.setHours(WAKE, 0, 0, 0); e.setHours(SLEEP, 0, 0, 0);
      var lo = Math.max(a, s), hi = Math.min(b, e);
      if (hi > lo) t += hi - lo;
      day.setDate(day.getDate() + 1);
    }
    return t / 60000;
  }
  function itemMin(i, isCheck) { return i.min != null ? i.min : isCheck ? EST.selfCheck : i.lesson ? EST.linked : EST.item; }
  // Minutes of work left in a state. Plan days that start after the deadline
  // (the morning of the day itself) aren't part of it.
  function work(st, dl) {
    // w.list keeps what each total is made of, as [label, minutes, link, html?].
    var w = { reading: 0, checks: 0, plan: 0, drills: 0, quiz: 0, review: 0, list: { reading: [], checks: [], plan: [], drills: [], quiz: [], review: [] } };
    function add(cat, label, min, href, html) { w[cat] += min; w.list[cat].push([label, min, href, html]); }
    LESSONS.forEach(function (l) {
      if (!st.done[readId(l.id)]) add("reading", l.title, l.min, "#/lesson/" + l.id);
      var q = st.quiz[l.id]; if (!q || q.best < q.of - 1) add("checks", l.title, EST.check, "#/lesson/" + l.id + "/check");
    });
    PLAN.forEach(function (d) {
      if (dl && START) { var ds = planDate(d.n); ds.setHours(0, 0, 0, 0); if (ds > dl) return; }
      d.groups.forEach(function (g) { g.items.forEach(function (i) { if (!st.done[i.id]) add("plan", i.t, itemMin(i, false), "#/plan/" + i.id, true); }); });
      d.checks.forEach(function (i) { if (!st.done[i.id]) add("plan", i.t, itemMin(i, true), "#/plan/" + i.id, true); });
    });
    if (drills) drills.forEach(function (d) {
      if (!drillTried(d, st)) add("drills", d.title, d.minutes + EST.drillExtra, "#/drill/" + d.id);
    });
    if (quizzes) Object.keys(quizzes).forEach(function (k) {
      var n = 0;
      quizzes[k].forEach(function (q, qi) { var a = st.answers[k + "." + qi]; if (qi >= CHECK_N && !(a && a.ok)) n++; });
      if (n) add("quiz", n + " in " + (BY_ID[k] ? BY_ID[k].title : k), n * EST.extraQ, "#/quiz/" + k);
    });
    var rv = Object.keys(st.review).length;
    if (rv) add("review", rv + " missed question" + (rv === 1 ? "" : "s"), rv * EST.review, "#/review");
    w.total = w.reading + w.checks + w.plan + w.drills + w.quiz + w.review;
    return w;
  }
  function pace() {
    var dl = deadline(); if (!dl) return null;
    var now = new Date(), left = work(state, dl), all = work(blank(), dl);
    var r = { dl: dl, w: left, left: left.total, all: all.total, avail: awake(now, dl) };
    r.doneFrac = all.total ? Math.max(0, 1 - left.total / all.total) : 1;
    // Where you should be by now: the share of usable time since day 1 that has gone.
    if (START) {
      var from = new Date(START); from.setHours(WAKE, 0, 0, 0);
      var span = awake(from, dl);
      if (span > 0 && now > from) { r.dueFrac = Math.min(1, awake(from, now) / span); r.diff = (r.doneFrac - r.dueFrac) * all.total; }
    }
    var eod = new Date(now); eod.setHours(SLEEP, 0, 0, 0); if (eod > dl) eod = dl;
    r.today = r.avail ? left.total * awake(now, eod) / r.avail : left.total;
    r.eod = eod;
    r.v = left.total < 1 ? "done" : now >= dl ? "over" : left.total > r.avail ? "short" : left.total > 0.8 * r.avail ? "tight" : "ok";
    return r;
  }
  function hm(min) {
    min = Math.round(min);
    if (min < 60) return min + " m";
    return Math.floor(min / 60) + " h" + (min % 60 ? " " + (min % 60) + " m" : "");
  }
  function fmtWhen(t) {
    return t.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + ", " + hhmm(t);
  }
  function aheadText(r) {
    if (r.diff == null) return "";
    return Math.abs(r.diff) < 10 ? "On schedule" : r.diff > 0 ? "Ahead by " + hm(r.diff) : "Behind by " + hm(-r.diff);
  }
  function paintDeadline() {
    var el = document.getElementById("deadline"); if (!el) return;
    var r = pace(); el.hidden = !r; if (!r) return;
    el.dataset.v = r.v;
    setText("dl-label", "Finish by " + fmtWhen(r.dl));
    var diff = document.getElementById("dl-diff");
    diff.textContent = r.v === "done" ? "" : aheadText(r);
    if (r.diff != null && r.diff <= -10) diff.dataset.ahead = "false"; else delete diff.dataset.ahead;
    if (r.v === "done") { setText("dl-left", "All done"); setText("dl-avail", ""); setText("dl-today", ""); }
    else {
      document.getElementById("dl-left").innerHTML = '<a href="#/record/left">' + esc(hm(r.left)) + " <small>of work left ›</small></a>";
      setText("dl-avail", r.v === "over" ? "Deadline passed" : hm(r.avail) + " usable before then");
      setText("dl-today", r.v === "over" ? "" : r.v === "short" ? "More work than time: cut the quiz-only questions and drills first" :
        "Today: about " + hm(r.today) + " more, by " + hhmm(r.eod));
    }
    var lit = Math.floor(r.doneFrac * 20), due = r.dueFrac == null ? -1 : Math.min(19, Math.floor(r.dueFrac * 20));
    Array.prototype.forEach.call(document.querySelectorAll("#dl-ticks i"), function (t, i) { t.className = (i < lit ? "on" : "") + (i === due ? " due" : ""); });
  }
  function deadlineLine() {
    var r = pace(); if (!r || r.v === "done") return "";
    var a = aheadText(r);
    return '<span class="stamp dl-line"><a href="#/record/left">' + hm(r.left) + " of work left</a> · " + (r.v === "over" ? "deadline passed" : hm(r.avail) + " usable until " + esc(fmtWhen(r.dl))) +
      (a ? ' · <span' + (r.diff <= -10 ? ' data-ahead="false"' : "") + ">" + a.toLowerCase() + "</span>" : "") + "</span>";
  }
  function deadlineHtml() {
    var r = pace(), dl = deadline();
    var local = dl ? new Date(dl.getTime() - dl.getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
    var h = '<section class="instrument"><div class="section-head"><span class="label">Deadline</span><h2>' +
      (r ? (r.v === "done" ? "Everything done" : hm(r.left) + " of work left") : "No deadline set") + "</h2>" +
      (r && r.v !== "done" ? '<span class="stamp">' + (r.v === "over" ? "The deadline has passed" : hm(r.avail) + " usable before " + esc(fmtWhen(r.dl))) + (aheadText(r) ? " · " + aheadText(r) : "") + "</span>" : "") + "</div>";
    if (r && r.v !== "done") {
      var rows = [["Reading", r.w.reading], ["Lesson checks", r.w.checks], ["Plan items and self-checks", r.w.plan], ["Drills", r.w.drills], ["Quiz-only questions", r.w.quiz], ["Reviews waiting", r.w.review]];
      var cats = ["reading", "checks", "plan", "drills", "quiz", "review"];
      h += '<ul class="dl-break" id="work-left">' + rows.map(function (x, i) { return [x[0], x[1], r.w.list[cats[i]]]; }).filter(function (x) { return x[2].length; }).map(function (x) {
        return '<li><details><summary><span>' + x[0] + " · " + x[2].length + '</span><span class="stamp">' + hm(x[1]) + "</span></summary>" +
          '<ul class="dl-items">' + x[2].map(function (it) {
            return '<li><a href="' + it[2] + '">' + (it[3] ? it[0] : esc(it[0])) + ' ›</a><span class="stamp">' + (it[1] < 1 ? Math.round(it[1] * 60) + " s" : hm(it[1])) + "</span></li>";
          }).join("") + "</ul></details></li>";
      }).join("") + "</ul>";
    }
    h += '<form class="dl-form" data-deadline><input class="field" type="datetime-local" name="at" required value="' + local + '" aria-label="Finish everything by">' +
      '<button class="btn" type="submit">Set deadline</button>' +
      (state.deadline && CONFIG.finish_by ? '<button type="button" class="btn btn-quiet" data-act="dl-reset">Back to default</button>' : "") + "</form>" +
      '<p class="stamp" style="margin-top:0.75rem">Estimates: each lesson\'s reading time, ' + EST.check + " min a check, " + EST.selfCheck + " min a self-check, " + EST.item +
      " min other plan items, a drill's time plus " + EST.drillExtra + " min, 45 s per quiz-only question. Usable time is " + pad2(WAKE) + ":00–" + SLEEP + ":00; nights don't count.</p></section>";
    return h;
  }

  // ---- Every answer, from a check, a review or a quiz round, is counted
  // here: the analysis is built from these, not from best scores. ----
  function record(key, right) {
    var a = state.answers[key] || { n: 0, ok: 0, last: today(), r: false };
    a.n++; if (right) a.ok++; a.last = today(); a.r = right;
    state.answers[key] = a;
    var d = state.perday[today()] || { n: 0, ok: 0 };
    d.n++; if (right) d.ok++;
    state.perday[today()] = d;
  }
  function pct(ok, n) { return n ? Math.round(100 * ok / n) : 0; }

  // ==== Quiz rounds: ten questions, one at a time, weighted towards what
  // you get wrong and what you haven't seen. ====
  var ROUND = 10, quizScope = null, round = null;
  var SCOPES = [["mix", "Smart mix"], ["weak", "Weak spots"], ["unseen", "Unseen"]].concat(PARTS.map(function (p) { return ["part-" + p.n, p.short || p.title]; }));
  function lessonsRead() { return LESSONS.filter(function (l) { return state.done[readId(l.id)] || state.quiz[l.id]; }); }
  function lessonStats(id) {
    var n = 0, ok = 0, seen = 0;
    Object.keys(state.answers).forEach(function (k) {
      if (k.split(".")[0] !== id) return;
      var a = state.answers[k]; n += a.n; ok += a.ok; seen++;
    });
    return { n: n, ok: ok, seen: seen };
  }
  function scopeLessons(scope) {
    var pm = /^part-(\d+)$/.exec(scope);
    if (pm) return LESSONS.filter(function (l) { return String(l.part.n) === pm[1]; });
    if (BY_ID[scope]) return [BY_ID[scope]];
    if (scope === "weak") {
      var weak = LESSONS.filter(function (l) { var st = lessonStats(l.id); return st.n && st.ok / st.n < 0.8; });
      if (weak.length) return weak;
    }
    var read = lessonsRead();
    return read.length >= 2 ? read : LESSONS;
  }
  // Unseen: only questions never answered, from the lessons you've read; once
  // those are used up, from any lesson.
  function unseenKeys(all, lessons) {
    var out = [];
    lessons.forEach(function (l) { (all[l.id] || []).forEach(function (q, qi) { if (!state.answers[l.id + "." + qi]) out.push(l.id + "." + qi); }); });
    return out;
  }
  function pickRound(all, scope) {
    var pool = [];
    if (scope === "unseen") {
      var ks = unseenKeys(all, lessonsRead());
      if (!ks.length) ks = unseenKeys(all, LESSONS);
      ks.forEach(function (k) { pool.push([k, 1]); });
    } else scopeLessons(scope).forEach(function (l) {
      (all[l.id] || []).forEach(function (q, qi) {
        var k = l.id + "." + qi, a = state.answers[k], w;
        if (!a) w = 3;                                   // never seen
        else if (!a.r) w = 6;                            // got it wrong last time
        else w = 1 + 3 * (1 - a.ok / a.n);               // the shakier, the likelier
        if (a && a.r && a.last === today()) w *= 0.25;   // just got it right: rest it
        pool.push([k, w]);
      });
    });
    var out = [];
    while (out.length < ROUND && pool.length) {
      var total = pool.reduce(function (t, x) { return t + x[1]; }, 0), r = Math.random() * total, i = 0;
      while (r > pool[i][1] && i < pool.length - 1) { r -= pool[i][1]; i++; }
      out.push(pool.splice(i, 1)[0][0]);
    }
    return out;
  }

  function quizHtml() {
    var read = lessonsRead().length;
    return '<section class="section-head syl-head"><span class="label">Quiz · ' + ROUND + " questions a round</span>" +
      '<p class="lede">One question at a time, picked from what you\'ve read and weighted towards what you get wrong. Misses come back for review tomorrow. ' +
      "Questions that only appear here are +" + XP.extra + " XP the first time you get one right." + (read < 2 ? " You haven't read much yet, so questions come from every lesson." : "") + "</p>" +
      '<div class="chips" role="group" aria-label="What to quiz">' + SCOPES.map(function (x) {
        return '<a class="chip" href="#/quiz/' + x[0] + '"' + (quizScope === x[0] ? ' aria-current="true"' : "") + ">" + x[1] + "</a>";
      }).join("") + (BY_ID[quizScope] ? '<a class="chip" aria-current="true" href="#/quiz/' + quizScope + '">' + esc(BY_ID[quizScope].title) + "</a>" : "") +
      '</div></section><section class="instrument quiz round" id="round"><div class="placeholder"><i></i><i></i><i class="short"></i></div></section>';
  }
  function startRound() {
    return loadQuizzes().then(function (all) {
      round = { scope: quizScope, keys: pickRound(all, quizScope), i: 0, picks: {}, xp0: score().xp };
    });
  }
  function renderRound() {
    var box = document.getElementById("round"); if (!box) return;
    var go = round && round.scope === quizScope ? Promise.resolve() : startRound();
    go.then(function () { return loadQuizzes(); }).then(function (all) {
      if (route !== "quiz" || !document.getElementById("round")) return;
      var keys = round.keys, n = keys.length;
      if (!n) { box.innerHTML = '<div class="empty"><span class="label">No questions here</span><p>' + (round.scope === "unseen" ? "You've answered every question at least once. Try a smart mix or your weak spots." : "Nothing to ask in this scope yet.") + '</p></div>'; return; }
      var ticks = '<div class="ticks" aria-hidden="true">' + keys.map(function (k, i) {
        var p = round.picks[k], q = all[k.split(".")[0]][+k.split(".")[1]];
        return "<i" + (p == null ? "" : p === q[2] ? ' class="on"' : ' class="miss"') + "></i>";
      }).join("") + "</div>";
      var answered = Object.keys(round.picks).length;
      if (round.i >= n) {
        var got = keys.filter(function (k) { return round.picks[k] === all[k.split(".")[0]][+k.split(".")[1]][2]; }).length;
        var missed = keys.filter(function (k) { return round.picks[k] !== all[k.split(".")[0]][+k.split(".")[1]][2]; });
        var lessonsMissed = []; missed.forEach(function (k) { var id = k.split(".")[0]; if (lessonsMissed.indexOf(id) < 0) lessonsMissed.push(id); });
        var gain = score().xp - round.xp0;
        box.innerHTML = '<div class="round-head"><span class="label">Round done</span><span class="stamp">' + (gain > 0 ? "+" + gain + " XP" : "") + "</span></div>" + ticks +
          '<div class="result"><span class="readout">' + got + " <small>/ " + n + '</small></span><span class="stamp">' +
          (got === n ? "Clean round" : got >= n * 0.8 ? "Strong" : got >= n * 0.6 ? "Getting there" : "Worth rereading the lessons below") + "</span></div>" +
          (lessonsMissed.length ? '<div class="misses"><span class="label">Missed in</span>' + lessonsMissed.map(function (id) {
            return '<a href="#/lesson/' + id + '">' + esc(BY_ID[id] ? BY_ID[id].title : id) + " ›</a>";
          }).join("") + "</div>" : "") +
          '<div class="round-actions"><button type="button" class="btn btn-primary" data-act="new-round">Another round</button><a class="btn" href="#/record">See how you\'re doing</a></div>';
        return;
      }
      var k = keys[round.i], parts = k.split("."), q = all[parts[0]][+parts[1]], picked = round.picks[k], l = BY_ID[parts[0]];
      box.innerHTML = '<div class="round-head"><span class="label">Question ' + (round.i + 1) + " of " + n + '</span><span class="stamp">' + esc(l ? l.title : parts[0]) + "</span></div>" + ticks +
        questionHtml(q, k, picked, "") +
        (picked != null ? '<div class="round-actions"><button type="button" class="btn btn-primary" data-act="next-q" id="next-q">' + (round.i + 1 < n ? "Next ›" : "Finish") + "</button>" +
          (l ? '<a class="btn btn-quiet" href="#/lesson/' + l.id + '">Reread the lesson</a>' : "") + "</div>" : "");
      if (picked != null) { var nb = document.getElementById("next-q"); if (nb) nb.focus({ preventScroll: true }); }
      box.onclick = function (ev) {
        var b = ev.target.closest(".opt"); if (!b || round.picks[k] != null) return;
        var oi = +b.dataset.o, right = oi === q[2];
        round.picks[k] = oi;
        change(function () {
          record(k, right);
          if (!right) state.review[k] = tomorrow();
          else if (state.review[k]) { delete state.review[k]; state.cleared = (state.cleared || 0) + 1; }
        }, right ? (+parts[1] >= CHECK_N ? "New question right" : "Right") : "");
        renderRound();
      };
    }).catch(function () {
      if (route === "quiz") box.innerHTML = '<div class="empty"><span class="label">Quiz unavailable</span><p>The questions come from the server, which can\'t be reached, and aren\'t in the offline cache yet.</p></div>';
    });
  }
  // Keys 1-4 answer, Enter goes on: a round can be done without the mouse.
  document.addEventListener("keydown", function (ev) {
    if (route !== "quiz" || !round || /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
    var opts = document.querySelectorAll("#round .opt:not(:disabled)");
    if (/^[1-4]$/.test(ev.key) && opts[+ev.key - 1]) { opts[+ev.key - 1].click(); ev.preventDefault(); }
  });

  // ==== Analysis: how you're doing, from every recorded answer. ====
  function analysisHtml(s) {
    var keys = Object.keys(state.answers), n = 0, ok = 0;
    keys.forEach(function (k) { n += state.answers[k].n; ok += state.answers[k].ok; });
    var td = state.perday[today()] || { n: 0, ok: 0 };
    var total = quizzes ? Object.keys(quizzes).reduce(function (a, k) { return a + quizzes[k].length; }, 0) : 0;
    var h = '<section class="instrument"><div class="section-head"><span class="label">How you\'re doing</span>' +
      "<h2>" + (n ? pct(ok, n) + "% right over " + num(n) + " answer" + (n === 1 ? "" : "s") : "No answers counted yet") + "</h2>";
    var days = Object.keys(state.perday).sort();
    h += '<span class="stamp">' + (days.length ? "Counted since " + esc(days[0]) + " · checks before then only kept a best score" : "Every answer from now on, in checks, reviews and quiz rounds, is counted here") + "</span></div>";
    if (!n) return h + '<a class="btn btn-primary" href="#/quiz">Take a quiz round ›</a></section>' + paceHtml(s);
    var stats = [
      ["Today", td.n ? td.n + " · " + pct(td.ok, td.n) + "%" : "0"],
      ["Questions seen", keys.length + (total ? " / " + total : "")],
      ["Right last time", keys.filter(function (k) { return state.answers[k].r; }).length + " / " + keys.length],
      ["Due for review", String(s.due)]
    ];
    h += '<dl class="stats">' + stats.map(function (x) { return '<div><dt class="label">' + x[0] + '</dt><dd class="readout">' + x[1] + "</dd></div>"; }).join("") + "</dl>";
    // Last seven days with answers.
    var recent = days.slice(-7);
    if (recent.length > 1) {
      h += '<div class="section-head" style="margin:1.25rem 0 0.5rem"><span class="label">By day</span></div><ul class="days">' + recent.map(function (d) {
        var t = state.perday[d], lit = Math.round(10 * t.ok / t.n);
        return '<li><span class="stamp">' + esc(d) + '</span><span class="bar">' + bar(lit) + '</span><span class="stamp">' + t.n + " · " + pct(t.ok, t.n) + "%</span></li>";
      }).join("") + "</ul>";
    }
    h += "</section>";

    // Per lesson, weakest first. Under 3 answers, no verdict.
    var rows = LESSONS.map(function (l) { var st = lessonStats(l.id); st.l = l; return st; }).filter(function (x) { return x.n; });
    rows.forEach(function (x) { x.acc = x.ok / x.n; x.v = x.n < 3 ? "few" : x.acc < 0.6 ? "weak" : x.acc < 0.8 ? "shaky" : "solid"; });
    var order = { weak: 0, shaky: 1, few: 2, solid: 3 };
    rows.sort(function (a, b) { return order[a.v] - order[b.v] || a.acc - b.acc; });
    var untested = LESSONS.length - rows.length, weakN = rows.filter(function (x) { return x.v === "weak" || x.v === "shaky"; }).length;
    h += '<section class="instrument"><div class="section-head"><span class="label">By lesson · weakest first</span>' +
      '<span class="stamp">' + rows.length + " tested · " + untested + " not yet · under 3 answers gets no verdict</span></div>" +
      '<ul class="perf">' + rows.map(function (x) {
        var tag = { weak: "Weak", shaky: "Shaky", solid: "Solid", few: "Too few answers" }[x.v];
        return '<li data-v="' + x.v + '"><a href="#/quiz/' + x.l.id + '">' + esc(x.l.title) + '</a><span><span class="verdict-tag">' + tag + '</span> <span class="stamp">' + x.ok + "/" + x.n + " · " + pct(x.ok, x.n) + "%</span></span>" +
          '<span class="bar" aria-hidden="true">' + bar(Math.round(10 * x.acc)) + "</span></li>";
      }).join("") + "</ul>" +
      '<div class="round-actions">' + (weakN ? '<a class="btn btn-primary" href="#/quiz/weak">Quiz your weak spots ›</a>' : '<a class="btn btn-primary" href="#/quiz/mix">Quiz round ›</a>') + "</div>" +
      '<p class="stamp" style="margin-top:0.75rem">Tap a lesson to quiz just that one.</p></section>';

    // The questions missed most, so you know exactly what to reread.
    var worst = keys.filter(function (k) { return state.answers[k].n > state.answers[k].ok; })
      .sort(function (a, b) { var A = state.answers[a], B = state.answers[b]; return (B.n - B.ok) - (A.n - A.ok) || (A.ok / A.n) - (B.ok / B.n); }).slice(0, 5);
    if (worst.length && quizzes) {
      h += '<section class="instrument"><div class="section-head"><span class="label">Missed most</span></div><ul class="missed">' + worst.map(function (k) {
        var p = k.split("."), q = quizzes[p[0]] && quizzes[p[0]][+p[1]], a = state.answers[k], l = BY_ID[p[0]];
        if (!q) return "";
        return "<li><span>" + codeish(q[0]) + '</span><span class="stamp">Missed ' + (a.n - a.ok) + " of " + a.n + (a.r ? " · right last time" : "") +
          (l ? ' · <a href="#/lesson/' + l.id + '">' + esc(l.title) + "</a>" : "") + "</span></li>";
      }).join("") + "</ul></section>";
    }
    return h + paceHtml(s);
  }
  function bar(lit) { var h = ""; for (var i = 0; i < 10; i++) h += i < lit ? '<i class="on"></i>' : "<i></i>"; return h; }

  // Pace: are you where the plan says you should be by now? Only with a
  // start date; without one, "behind" would be a guess.
  function paceHtml(s) {
    var minsLeft = LESSONS.filter(function (l) { return !state.done[readId(l.id)]; }).reduce(function (a, l) { return a + l.min; }, 0);
    var h = '<section class="instrument pace"', body = "";
    if (START) {
      var due = 0, done = 0, now = new Date(); now.setHours(23, 59, 59);
      PLAN.forEach(function (d) { if (planDate(d.n) <= now) dayItems(d).forEach(function (i) { due++; if (state.done[i.id]) done++; }); });
      var behind = due - done;
      h += ' data-state="' + (behind > 0 ? "behind" : "ok") + '"';
      body += '<span class="readout">' + (due === 0 ? "Not started yet" : behind > 0 ? behind + " item" + (behind === 1 ? "" : "s") + " behind" : "On track") + "</span>" +
        '<span class="stamp">' + done + " of " + due + " plan items due by today are ticked</span>";
    }
    body += '<span class="stamp">' + s.read + " of " + LESSONS.length + " lessons read · " + (minsLeft ? "about " + (Math.round(minsLeft / 30) / 2) + " h of reading left" : "all read") +

  }

  // ---- Drills: timed code reviews with a ranked answer key ----
  var LEVELS = ["", "Very easy", "Easy", "Moderate", "Moderate-hard"], drillLevel = 0;
  function levelName(d) { return LEVELS[d.level] || ""; }
  function drillsHtml() {
    return '<section class="section-head syl-head"><span class="label">Drills · timed code reviews</span>' +
      '<p class="lede">Each drill is a short snippet with several planted bugs, and unlocks with a lesson: once you\'ve read it, Next up asks you for the drill. Start the timer, write down every problem you see, worst first, then reveal the answer key and tick what you found. Finding the worst bug is worth the most. Drills marked optional are extra practice: they earn no XP and don\'t count towards your progress.</p></section><div id="drill-list"><div class="placeholder"><i></i><i></i><i class="short"></i></div></div>';
  }
  function renderDrillList() {

        return n ? '<button type="button" class="chip" data-level="' + lv + '"' + (drillLevel === lv ? ' aria-current="true"' : "") + ">" + (lv ? name : "All") + " · " + n + "</button>" : "";
      }).join("") + "</div>";
      box.innerHTML = chips + '<section class="instrument"><ol class="lessons">' + ds.map(function (d, i) {
        if (drillLevel && d.level !== drillLevel) return "";
        var found = d.findings.filter(function (f, n) { return state.done["drill-" + d.id + "-" + n]; }).length, tried = drillTried(d);
        var when = tried ? "" : drillReady(d) ? "ready · " : BY_ID[d.after] ? "after lesson " + (LESSONS.indexOf(BY_ID[d.after]) + 1) + " · " : "";
        return '<li><a href="#/drill/' + d.id + '" data-read="' + tried + '"><span class="mark" aria-hidden="true"></span><span class="num stamp">' + pad2(i + 1) + '</span><span class="ltitle">' + esc(d.title) + '</span><span class="stamp meta">' + (tried ? found + "/" + d.findings.length + " found · " : when) + (d.optional ? "optional · " : "") + (levelName(d) ? levelName(d).toLowerCase() + " · " : "") + d.minutes + " min</span></a></li>";

  function drillHtml(id) {

  }
  function renderDrill(id) {
    loadDrills().then(function (ds) {

      if (!box || route !== "drill/" + id) return;
      if (!d) { location.hash = "#/drills"; return; }
      var revealed = !!MENTOR || drillTried(d) || box.dataset.revealed === "true";
      var h = '<article class="instrument lesson"><header class="lesson-head"><span class="label">' + (d.optional ? "Optional drill · " : "Drill · ") + (levelName(d) ? levelName(d) + " · " : "") + d.minutes + " minutes · " + d.findings.length + " planted problems</span><h2>" + esc(d.title) + '</h2><p class="why">' + codeish(d.context) + "</p></header>" +
        '<div class="drill-timer"><span class="readout" id="clock">' + d.minutes + ':00</span><button type="button" class="btn" id="clock-btn">Start timer</button></div>' +
        '<div class="reading"><pre><code>' + esc(d.code) + "</code></pre></div>" +
        '<label class="notes drill-own"><span class="label">Your findings, worst first</span><textarea id="notes" rows="6" placeholder="1. …"></textarea></label>';
      if (d.optional) h += '<p class="stamp drill-opt">Optional practice: no XP, and it doesn\'t count towards your progress, ranks or deadline.</p>';

      else {
        h += '<div class="section-head key-head"><span class="label">' + (MENTOR ? "Answer key · ticked = found" : "Answer key · tick what you found") + '</span></div><ul>' +
          d.findings.map(function (f, n) {
            return itemHtml({ id: "drill-" + d.id + "-" + n, t: (n === 0 ? '<span class="worst">Worst</span> ' : "") + codeish(f.t), why: codeish(f.d) }, false, true);

      box.innerHTML = h;
