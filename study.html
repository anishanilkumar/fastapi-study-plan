    else if (act === "unpark") { state.later.splice(+b.dataset.i, 1); queueSave(); updateCounts(); renderNotebook(); }
    else if (act === "save-offline") saveOffline();
    else if (act === "dl-reset") { state.deadline = null; queueSave(); updateCounts(); var y = window.scrollY; renderView(); window.scrollTo(0, y); }
    else if (act === "next-q") { round.i++; renderRound(); window.scrollTo(0, 0); }
    else if (act === "new-round") { round = null; renderRound(); window.scrollTo(0, 0); }
    else if (act === "mnote-done") closeNote();
    else if (act === "unmark") { changeMarks(b.dataset.lesson, function (list) { list.splice(+b.dataset.i, 1); }); renderNotebook(); }
  });
  // Keep the selection when the button is pressed with a mouse.
  document.addEventListener("mousedown", function (ev) { if (ev.target.closest && ev.target.closest("#selbar")) ev.preventDefault(); });
  document.addEventListener("submit", function (ev) {
    var f = ev.target;
    if (f.hasAttribute && f.hasAttribute("data-profile")) {
      ev.preventDefault();
      var label = f.elements.label.value.trim().slice(0, 40), at = new Date(f.elements.at.value), fin = new Date(f.elements.finish.value);
      var startV = /^\d{4}-\d{2}-\d{2}$/.test(f.elements.start.value) ? f.elements.start.value : null;
      if (label && isNaN(at)) { toast("Needs a date", "When is your " + label.toLowerCase() + "?"); f.elements.at.focus(); return; }
      state.profile = { start: startV, target: !isNaN(at) ? { label: label || "Goal", at: at.toISOString() } : null };
      state.deadline = isNaN(fin) ? null : fin.toISOString();
      queueSave(); applyProfile(); redrawAll();
      toast("Saved", TARGET ? TARGET.label + " · " + targetText() : "Your dates");
      return;
    }
    if (f.hasAttribute && f.hasAttribute("data-deadline")) {
      ev.preventDefault();
      var t = new Date(f.elements.at.value);
      if (isNaN(t)) return;
      state.deadline = t.toISOString(); queueSave(); updateCounts();
      if (route === "record") { var y = window.scrollY; renderView(); window.scrollTo(0, y); }
      toast("Deadline set", fmtWhen(t));
      return;
    }
    if (!f.hasAttribute || !f.hasAttribute("data-park")) return;
    ev.preventDefault();
    if (park(f.elements.t.value)) { f.elements.t.value = ""; if (route === "notes") renderNotebook(); }
  });
  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.id === "nb-q") { renderNotebook(); return; }
    if (t.dataset && t.dataset.mnote != null && noteEdit) {
      var nid = noteEdit.id, nt = noteEdit.t, nv = t.value.slice(0, 2000);
      var mn = state.marknotes[nid] || (state.marknotes[nid] = {});
      if (nv.trim()) mn[nt] = nv; else delete mn[nt];
      if (!Object.keys(mn).length) delete state.marknotes[nid];
      queueSave(); return;
    }
    if (!t.dataset || !t.dataset.note) return;
    var v = t.value.slice(0, 20000);
    if (v.trim()) state.notes[t.dataset.note] = v; else delete state.notes[t.dataset.note];
    queueSave();
    var nn = notebookCount(); setText("tab-notes", nn ? String(nn) : "");
  });

  // Leaving the note box closes it; an empty note is simply not kept.
  document.addEventListener("focusout", function (ev) {
    var t = ev.target;
    if (!t.dataset || t.dataset.mnote == null) return;
    var to = ev.relatedTarget;
    if (to && to.closest && to.closest(".mnote") === t.closest(".mnote")) return;
    closeNote();
  });
  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (t.dataset && t.dataset.mnote != null && (ev.key === "Escape" || (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)))) { ev.preventDefault(); t.blur(); return; }
    if (t.dataset && t.dataset.mnoteOpen != null && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); var id = route.slice(7), m = (state.marks[id] || [])[+t.dataset.mnoteOpen]; if (m) openNote(id, m); }
  });

  // ---- Routing ----
  //   #/plan  #/plan/<item>  #/syllabus  #/lesson/<id>[/check]  #/quiz[/<scope>]  #/drills  #/drill/<id>  #/review  #/notes  #/record
  function renderView() {
    var hash = location.hash.replace(/^#\/?/, "") || "plan";
    var m = /^lesson\/([a-z0-9-]+)(\/check)?$/.exec(hash), focus = /^plan\/([a-z0-9-]+)$/.exec(hash), dr = /^drill\/([a-z0-9]+)$/.exec(hash);
    var toRank = hash === "record/rank", toLeft = hash === "record/left"; if (toRank || toLeft) hash = "record";
    var qz = /^quiz(?:\/([a-z0-9-]+))?$/.exec(hash);
    if (qz) { quizScope = qz[1] || quizScope || "mix"; hash = "quiz"; }
    if (m && !BY_ID[m[1]]) { m = null; hash = "syllabus"; }
    if (focus) hash = "plan";
    if (MENTOR) {
      // No lesson texts, quizzes or reviews here: those need the login.
      if (m) { m = null; hash = "syllabus"; }
      if (hash === "quiz" || hash === "review") hash = "record";
      if (!location.hash) hash = "record";
    }
    if (!m && !dr && ["plan", "syllabus", "record", "drills", "review", "notes", "quiz"].indexOf(hash) < 0) hash = "plan";
    if (route === "plan") planScroll = window.scrollY;
    if (route && route.indexOf("drill/") === 0) stopClock();
    route = m ? "lesson/" + m[1] : dr ? "drill/" + dr[1] : hash;
    document.body.dataset.view = m || dr || hash === "review" ? "detail" : hash;
    var view = document.getElementById("view");
    var tab = m ? "syllabus" : dr ? "drills" : hash === "review" ? "plan" : hash;
    view.innerHTML = m ? lessonHtml(BY_ID[m[1]]) : dr ? drillHtml(dr[1]) :
      hash === "syllabus" ? syllabusHtml() : hash === "record" ? recordHtml() : hash === "drills" ? drillsHtml() : hash === "review" ? reviewHtml() :
      hash === "notes" ? notesHtml() : hash === "quiz" ? quizHtml() : planHtml();
    // In focus mode the tabs are gone, so every other view ends with the next step.
    if (hash !== "plan" || m || dr) view.insertAdjacentHTML("beforeend", '<div class="next-box focus-only" data-next></div>');
    hideSelbar();
    Array.prototype.forEach.call(document.querySelectorAll(".tabs a"), function (a) {
      if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    updateCounts();
    if (m) {
      loadLesson(BY_ID[m[1]]); renderQuiz(BY_ID[m[1]]);
      if (m[2]) document.getElementById("check").scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);
    } else if (dr) { renderDrill(dr[1]); window.scrollTo(0, 0); }
    else if (hash === "drills") { renderDrillList(); window.scrollTo(0, 0); }
    else if (hash === "review") { reviewRun = {}; renderReview(); window.scrollTo(0, 0); }
    else if (hash === "notes") { renderNotebook(); window.scrollTo(0, 0); }
    else if (hash === "quiz") { renderRound(); window.scrollTo(0, 0); }
    else if (focus) {
      var row = document.querySelector('[data-item="' + focus[1] + '"]');
      if (row) { row.scrollIntoView({ block: "center" }); row.classList.add("flash"); setTimeout(function () { row.classList.remove("flash"); }, 1600); }
    } else if (toRank && document.getElementById("next-rank")) document.getElementById("next-rank").scrollIntoView({ block: "start" });
    else if (toLeft && document.getElementById("work-left")) {
      var wl = document.getElementById("work-left"), ds = wl.querySelectorAll("details");
      if (ds.length === 1) ds[0].open = true;                    // one kind of thing left: show it straight away
      wl.scrollIntoView({ block: "center" });
    }
    else window.scrollTo(0, hash === "plan" ? planScroll : 0);
  }

  function setText(id, text) { var el = document.getElementById(id); if (el) el.textContent = text; }
  function updateCounts() {
    var s = score(), r = s.rank, nextR = RANKS[r + 1];
    setText("rank", RANKS[r].t);
    var xpEl = document.getElementById("xp");
    if (xpEl) xpEl.innerHTML = num(s.xp) + " XP" + (!nextR ? " · top rank" : ' · <a href="#/record/rank">next: ' + esc(nextR.t) + " ›</a>");
    document.getElementById("today").innerHTML = num(s.today) + " <small>XP</small>";
    setText("goal", s.today >= GOAL ? "Goal met" : "Goal " + GOAL);
    var lit = Math.min(30, Math.floor(30 * s.today / GOAL));
    Array.prototype.forEach.call(document.querySelectorAll(".dial line"), function (ln, i) { ln.classList.toggle("on", i < lit); });
    document.querySelector(".dial").classList.toggle("full", s.today >= GOAL);
    document.getElementById("streak").innerHTML = s.streak + " <small>d</small>";
    setText("best", "Longest " + s.longest + " d");
    // 20 segments of progress through the current rank.
    var lo = RANKS[r].xp, hi = nextR ? nextR.xp : s.max, frac = nextR ? Math.min(1, (s.xp - lo) / (hi - lo)) : 1;
    Array.prototype.forEach.call(document.querySelectorAll("#ticks i"), function (el, i) { el.className = i < Math.floor(frac * 20) ? "on" : ""; });
    setText("tab-plan", s.planDone + "/" + allIds().length);
    setText("tab-syl", s.read + "/" + LESSONS.length);
    setText("tab-drl", drills ? s.drillsTried + "/" + drills.length : "");
    setText("tab-rec", s.badges.length + "/" + BADGES.length);
    var nn = notebookCount();
    setText("tab-notes", nn ? String(nn) : "");
    Array.prototype.forEach.call(document.querySelectorAll("[data-ldrills]"), function (el) {
      var mine = (allDrills || []).filter(function (d) { return d.after === el.dataset.ldrills; }), lh = "";
      if (mine.length) {
        lh = '<section class="instrument"><div class="section-head"><span class="label">Test what you read · code review</span>' +
          '<p class="why">' + (state.done[readId(el.dataset.ldrills)] ? "Unlocked. Find the bugs before you look at the key." : "Unlocks when you tick \u201cI\u2019ve read this\u201d. Find the bugs before you look at the key.") + "</p></div><ul>" +
          mine.map(function (d) {
            return '<li class="next-actions"><a class="btn' + (drillTried(d) ? "" : " btn-primary") + '" href="#/drill/' + d.id + '">' + esc(d.title) + " · " + (d.optional ? "optional · " : "") + d.minutes + " min ›</a>" + (drillTried(d) ? '<span class="stamp">Done</span>' : "") + "</li>";
          }).join("") + "</ul></section>";
      }
      if (el._h !== lh) { el.innerHTML = lh; el._h = lh; }
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-today]"), function (el) {
      var th = todayHtml(); if (el._h !== th) { el.innerHTML = th; el._h = th; }
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-next]"), function (el) {
      var nh = nextHtml(); if (el._h !== nh) { el.innerHTML = nh; el._h = nh; }
    });
    setText("fb-sub", fzSub(s));
    paintDeadline();
    PLAN.forEach(function (d) {
      var el = document.getElementById("count-" + d.id); if (!el) return;
      var all = dayItems(d), k = all.filter(function (i) { return state.done[i.id]; }).length;
      el.textContent = k === all.length ? "Done" : k + " / " + all.length;
      el.dataset.full = String(k === all.length);
    });
    PARTS.forEach(function (p) {
      var el = document.getElementById("pcount-" + p.n); if (!el) return;
      var k = p.lessons.filter(function (l) { return state.done[readId(l.id)]; }).length;
      el.textContent = k === p.lessons.length ? "Read" : k + " / " + p.lessons.length + " read";
      el.dataset.full = String(k === p.lessons.length);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-lesson]"), function (a) {
      a.dataset.read = String(!!state.done[readId(a.dataset.lesson)]);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".qscore"), function (el) {
      var q = state.quiz[el.dataset.q];
      el.textContent = q ? q.best + "/" + q.of + " · " : "";
      el.dataset.pass = String(passed(el.dataset.q));
    });
  }

  function updateCountdown() {
    var el = document.getElementById("countdown"); if (!el || !TARGET) return;
    var ms = TARGET.at.getTime() - Date.now();
    if (ms <= 0) { el.textContent = "Passed"; return; }
    var hrs = Math.floor(ms / 3600000), d = Math.floor(hrs / 24);
    el.innerHTML = (d > 0 ? d + " <small>d</small> " : "") + (hrs % 24) + " <small>h</small>";
  }

  // ---- Status: the dot carries the state, the stamp says it plainly. ----
  function setStatus(kind, text) {
    var s = document.getElementById("status");
    s.dataset.state = kind;
    document.getElementById("status-text").textContent = text;
    // Grey out the accents only when the server is out of reach.
    if (kind === "local") document.documentElement.dataset.connection = "offline";
    else delete document.documentElement.dataset.connection;
  }

  // ---- Server sync ----
  // A 10 s limit: on a weak mobile signal a request can hang far longer
  // than that, and an unanswered save would block the next one.
  function api(method, body) {
    var ctl = window.AbortController ? new AbortController() : null;
    var t = ctl ? setTimeout(function () { ctl.abort(); }, 10000) : null;
    return fetch(BASE + "state", {
      method: method, cache: "no-store", signal: ctl ? ctl.signal : undefined,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      clearTimeout(t);
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.json();
    }, function (e) { clearTimeout(t); throw e; });
  }

  // ---- Offline readiness: count what's actually in the cache on this
  // device, rather than assume the service worker got it all. ----
  function offlineUrls() { return LESSONS.map(function (l) { return BASE + "lessons/" + l.id + ".html"; }); }
  var CORE_URLS = [BASE, BASE + "quizzes.json", BASE + "drills.json"];
  function paintOffline(kind, text, button) {
    var el = document.getElementById("offline"); if (!el) return;
    el.hidden = !kind; el.dataset.state = kind || "";
    setText("offline-text", text || "");
    document.getElementById("offline-btn").hidden = !button;
  }
  function checkOffline(fill) {
    if (!window.caches || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
    var urls = CORE_URLS.concat(offlineUrls());
    Promise.all(urls.map(function (u) { return caches.match(u).then(function (r) { return !!r; }, function () { return false; }); })).then(function (hits) {
      var missing = urls.filter(function (u, i) { return !hits[i]; });
      var lessonsIn = hits.slice(CORE_URLS.length).filter(Boolean).length;
      if (!missing.length) { paintOffline("ready", "Offline ready · all " + LESSONS.length + " lessons on this device"); return; }
      if (fill && navigator.onLine) { saveOffline(missing); return; }
      paintOffline("partial", "Offline · " + lessonsIn + " of " + LESSONS.length + " lessons on this device" + (hits[0] ? "" : " · page not saved"), navigator.onLine);
    });
  }
  // Fetching through the service worker is what stores a file, so saving
  // the rest is just asking for it.
  function saveOffline(urls) {
    paintOffline("saving", "Saving lessons for offline");
    Promise.all((urls || CORE_URLS.concat(offlineUrls())).map(function (u) {
      return fetch(u, { credentials: "same-origin" }).then(function (r) { return r.ok && r.text(); }).catch(function () { return null; });
    })).then(function () { setTimeout(function () { checkOffline(false); }, 300); });
  }

  function unreachable(err) {
    var kept = writeLocal();
    if (err && err.status) setStatus("unsent", "Server refused the save (" + err.status + ") · " + (kept ? "kept in this browser" : "not saved"));
    else setStatus("local", kept ? "Server unreachable · progress kept in this browser" : "Server unreachable · progress will reset on reload");
  }

  function push() {
    if (inflight) return;
    inflight = true;
    var mine = seq;
    setStatus("syncing", "Saving");
    api("PUT", payload()).then(function () {
      inflight = false;
      if (mine !== seq) { push(); return; }   // changed again while saving
      dirty = false; writeLocal();
      setStatus("ok", "Saved on server · " + hhmm(new Date()));
    }).catch(function (e) { inflight = false; unreachable(e); });
  }

  function queueSave() {
    if (MENTOR) return;
    if (DEMO) { writeLocal(); setStatus("ok", "Saved in this browser · " + hhmm(new Date())); return; }
    dirty = true; seq++;
    writeLocal();
    setStatus("unsent", "Unsent");
    clearTimeout(timer); timer = setTimeout(push, 600);
  }

  document.addEventListener("change", function (ev) {
    var t = ev.target; if (!t || !t.dataset || !t.dataset.id) return;
    var id = t.dataset.id, on = t.checked;
    var label = id.indexOf("read-") === 0 ? "Read · " + (BY_ID[id.slice(5)] || {}).title : DRILL_ID.test(id) ? "Found it" : "Ticked";
    change(function () { if (on) state.done[id] = true; else delete state.done[id]; }, label);
    // The same id can show twice (a lesson's plan items); keep both in step.
    Array.prototype.forEach.call(document.querySelectorAll('input[data-id="' + id + '"]'), function (cb) { cb.checked = on; });
  });

  // Retry unsent changes when the network or the tab comes back, and every 30 s.
  // With nothing unsent, still check in when the server was out of reach,
  // so the status line doesn't keep saying "unreachable" after it's back.
  function retry() {
    if (DEMO || MENTOR || inflight) return;
    if (dirty) push();
    else if (document.getElementById("status").dataset.state === "local") pull();
  }
  window.addEventListener("online", retry);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { retry(); updateCounts(); } });
  setInterval(retry, 30000);
  setInterval(function () { updateCountdown(); updateCounts(); }, 60000);   // the deadline moves with the clock

  // ---- Load: local copy first (instant), then the server's. ----
  var local = MENTOR ? null : readLocal();
  if (local) { adopt(local); dirty = !!local.dirty; }
  if (MENTOR) { adopt(MENTOR.state); quizzes = MENTOR.quizzes; setDrills(MENTOR.drills); document.body.dataset.mentor = "on"; }
  renderShell();
  // Every field a mentor sees is read-only, wherever a view draws one.
  if (MENTOR && window.MutationObserver) new MutationObserver(function () {
    Array.prototype.forEach.call(document.querySelectorAll("#view textarea, #view input"), function (el) {
      if (el.type === "checkbox") el.disabled = true; else el.readOnly = true;
    });
  }).observe(document.getElementById("root"), { childList: true, subtree: true });
  if (!MENTOR) setFocus(fz.on, true);
  renderView();
  if (!MENTOR) { paintFocus(true); setInterval(tickFocus, 1000); }
  window.addEventListener("hashchange", renderView);
  loadDrills().catch(function () {});
  // The analysis on Record needs the questions' text and count.
  loadQuizzes().then(function () { if (route === "record") renderView(); updateCounts(); }).catch(function () {});
  if (DEMO) setStatus("ok", "Demo · progress stays in this browser");
  function pull() {
    inflight = true;
    api("GET").then(function (srv) {
      inflight = false;
      var first = !synced; synced = true;
      if (dirty) { push(); if (first && needSetup()) redrawAll(); return; }   // local has changes the server never got
      var was = JSON.stringify(state.profile);
      adopt(srv);
      if (JSON.stringify(state.profile) !== was || (first && needSetup())) redrawAll();
      writeLocal();
      // Update in place rather than re-rendering, so a lesson being read
      // isn't reloaded and the scroll position stays put.
      Array.prototype.forEach.call(document.querySelectorAll("input[data-id]"), function (cb) { cb.checked = !!state.done[cb.dataset.id]; });
      refreshNotebook();
      // Record is built from the whole state, so it's redrawn rather than patched.
      if (route === "record") { var y = window.scrollY; renderView(); window.scrollTo(0, y); }
      updateCounts();
      var at = srv.updated_at ? " · last change " + hhmm(new Date(srv.updated_at)) : "";
      setStatus("ok", "Synced with server" + at);
    }).catch(function (e) { inflight = false; unreachable(e); });
  }
  if (MENTOR) setStatus("ok", "Read-only" + (MENTOR.state.updated_at ? " · last change " + fmtWhen(new Date(MENTOR.state.updated_at)) : " · nothing recorded yet"));
  else if (!DEMO) pull();

  // Offline: cache the page, lessons and questions. Served over http(s) only.
  if (!MENTOR && "serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
    // First visit: the page isn't controlled until the worker activates.
    navigator.serviceWorker.addEventListener("controllerchange", function () { setTimeout(function () { checkOffline(true); }, 500); });
    if (navigator.serviceWorker.controller) setTimeout(function () { checkOffline(true); }, 1500);
    window.addEventListener("online", function () { checkOffline(true); });
  }
})();
</script>
</body>
</html>
