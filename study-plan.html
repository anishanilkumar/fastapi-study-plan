      var reveal = document.getElementById("reveal");
      if (reveal) reveal.onclick = function () { stopClock(); box.dataset.revealed = "true"; renderDrill(id); };
      document.getElementById("clock-btn").onclick = function () { drillTimer.id === d.id && drillTimer.handle ? stopClock() : startClock(d); };
      paintClock(d);
    });
  }
  // The timer is the one thing that moves on its own, and only while running.
  function startClock(d) {
    stopClock();
    drillTimer = { id: d.id, end: Date.now() + d.minutes * 60000, handle: setInterval(function () { paintClock(d); }, 1000) };
    paintClock(d);
  }
  function stopClock() { if (drillTimer.handle) clearInterval(drillTimer.handle); drillTimer.handle = null; }
  function paintClock(d) {
    var el = document.getElementById("clock"), btn = document.getElementById("clock-btn");
    if (!el) { stopClock(); return; }
    var running = drillTimer.id === d.id && drillTimer.handle;
    if (!running) { btn.textContent = "Start timer"; return; }
    var ms = Math.max(0, drillTimer.end - Date.now()), m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000);
    el.textContent = m + ":" + pad2(s);
    el.dataset.state = ms === 0 ? "over" : ms < 60000 ? "low" : "";
    btn.textContent = "Stop";
    if (ms === 0) { stopClock(); btn.textContent = "Time · restart"; toast("Time", "Rank what you found, then reveal the key"); }
  }

  // ==== Focus mode and the block timer ====
  // A block is 25 minutes (or 15 when starting is hard), then a 5-minute
  // break. Each finished block is +XP.block. The timer lives in this browser
  // only (a per-device convenience, like a kitchen timer), and survives a
  // reload: it's kept as an end time, not a count of ticks.
  var FKEY = LS + "-focus", BREAK_MIN = 5;
  var fz = (function () { try { return JSON.parse(localStorage.getItem(FKEY) || "null"); } catch (e) { return null; } })() ||
    { on: false, mode: "idle", len: 25, end: 0, left: 0 };
  function saveFocus() { try { localStorage.setItem(FKEY, JSON.stringify(fz)); } catch (e) {} }
  function fzLeft() { return fz.end ? Math.max(0, fz.end - Date.now()) : fz.left; }
  function mmss(ms) { var t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ":" + pad2(t % 60); }
  function fzSub(s) {
    var n = s.blocksToday;
    return (n ? n + " block" + (n === 1 ? "" : "s") + " today" : "No blocks yet today") + " · +" + XP.block + " XP each";
  }

  function setFocus(on, quiet) {
    fz.on = !!on; saveFocus();
    if (fz.on) document.body.dataset.focus = "on"; else delete document.body.dataset.focus;
    if (!quiet) { paintFocus(true); window.scrollTo(0, 0); }
  }

  function startBlock(len) {
    unlockSound();
    fz.mode = "work"; fz.len = len; fz.end = Date.now() + len * 60000; fz.left = 0;
    saveFocus(); paintFocus(true);
  }
  function pauseBlock() { fz.left = fzLeft(); fz.end = 0; saveFocus(); paintFocus(true); }
  function resumeBlock() { unlockSound(); fz.end = Date.now() + fz.left; fz.left = 0; saveFocus(); paintFocus(true); }
  function stopBlock() { fz.mode = "idle"; fz.end = 0; fz.left = 0; saveFocus(); paintFocus(true); }

  function tickFocus() {
    if (fz.mode === "idle" || !fz.end) return;
    if (Date.now() < fz.end) { paintFocus(false); return; }
    var late = Date.now() - fz.end;
    if (fz.mode === "work") {
      // Ran out while the page was closed for over an hour: the block isn't
      // credited. Who knows what happened in that time; the record shouldn't guess.
      if (late < 3600000) {
        change(function () { state.blocks[today()] = Math.min(48, (state.blocks[today()] || 0) + 1); }, "Focus block · " + fz.len + " min");
        chime();
        fz.mode = "break"; fz.end = Date.now() + BREAK_MIN * 60000;
        toast("Break · " + BREAK_MIN + " min", "Stand up, get water. Not the phone.");
      } else { fz.mode = "idle"; fz.end = 0; }
    } else {
      fz.mode = "idle"; fz.end = 0;
      if (late < 600000) { chime(); toast("Break over", "One more block?"); }
    }
    saveFocus(); paintFocus(true);
  }

  function paintFocus(full) {
    var bar = document.getElementById("focusbar"); if (!bar) return;
    var running = fz.mode !== "idle", paused = running && !fz.end;
    if (running) document.body.dataset.timer = "on"; else delete document.body.dataset.timer;
    bar.dataset.mode = fz.mode; bar.dataset.paused = String(paused);
    var left = running ? fzLeft() : fz.len * 60000, total = (fz.mode === "break" ? BREAK_MIN : fz.len) * 60000;
    setText("fb-clock", mmss(left));
    setText("fb-label", fz.mode === "break" ? "Break" : paused ? "Focus block · paused" : running ? "Focus block · " + fz.len + " min" : "Focus block");
    var lit = running ? Math.floor(20 * (1 - left / total)) : 0;
    Array.prototype.forEach.call(document.querySelectorAll("#fb-ticks i"), function (el, i) { el.className = i < lit ? "on" : ""; });
    document.title = (running && !paused ? mmss(left) + " · " + (fz.mode === "break" ? "Break" : "Focus") + " · " : "") + TITLE;
    if (!full) return;
    var b = function (act, text, cls, extra) { return '<button type="button" class="btn' + (cls ? " " + cls : "") + '" data-act="' + act + '"' + (extra || "") + ">" + text + "</button>"; };
    var h = "";
    if (fz.mode === "idle") h = b("start", "Start 25 min", "btn-primary", ' data-len="25"') + b("start", "15 min", "", ' data-len="15"');
    else if (fz.mode === "work") h = (paused ? b("resume", "Resume", "btn-primary") : b("pause", "Pause")) + b("stop", "Stop");
    else h = b("stop", "Skip break");
    h += fz.on ? b("focus-off", "Exit focus", "btn-quiet") : b("focus-on", "Focus mode", "btn-quiet");
    document.getElementById("fb-ctl").innerHTML = h;
    setText("fb-sub", fzSub(score()));
  }

  // Two short tones at the end of a block or break. Browsers only allow
  // sound after a tap, so the context is created on Start.
  var audio = null;
  function unlockSound() {
    try { if (!audio) { var C = window.AudioContext || window.webkitAudioContext; if (C) audio = new C(); } if (audio && audio.state === "suspended") audio.resume(); } catch (e) {}
  }
  function chime() {
    if (!audio) return;
    try {
      [[0, 660], [0.28, 880]].forEach(function (n) {
        var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + n[0];
        o.frequency.value = n[1];
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.55);
      });
    } catch (e) {}
  }

  // ==== The notebook: parked thoughts, notes and highlights ====
  function notebookCount() {
    var n = state.later.length + Object.keys(state.notes).length;
    Object.keys(state.marks).forEach(function (k) { n += state.marks[k].length; });
    return n;
  }
  function park(text) {
    var t = text.trim().slice(0, 500); if (!t) return false;
    if (state.later.length >= 300) { toast("Full", "Clear some parked thoughts first"); return false; }
    state.later.push({ t: t, at: today() });
    queueSave(); updateCounts();
    toast("Parked", "It's in Notes. Back to the task.");
    return true;
  }

  function notesHtml() {
    return '<section class="section-head syl-head"><span class="label">Notes</span>' +
      '<p class="lede">What you parked, wrote and highlighted. Highlight by selecting text in any lesson; write notes under each one. Saved with the rest of your progress.</p>' +
      '<div class="nb-search"><input class="field" type="search" id="nb-q" placeholder="Search your notes" aria-label="Search your notes"></div></section><div id="nb"></div>';
  }
  function renderNotebook() {
    var box = document.getElementById("nb"); if (!box) return;
    var qel = document.getElementById("nb-q"), q = qel ? qel.value.trim().toLowerCase() : "";
    var hit = function (t) { return !q || String(t).toLowerCase().indexOf(q) >= 0; };
    var h = "", later = state.later.map(function (x, i) { return [x, i]; }).filter(function (p) { return hit(p[0].t); });
    h += '<section class="instrument"><div class="section-head"><span class="label">Parked for later · ' + state.later.length + "</span>" +
      '<p class="why">Thoughts that showed up mid-task. Deal with them after the block, or never.</p></div>';
    if (later.length) {
      h += '<ul class="nb-later">' + later.slice().reverse().map(function (p) {
        return "<li><span>" + esc(p[0].t) + '</span><span class="stamp">' + esc(p[0].at) + '</span><button type="button" class="btn" data-act="unpark" data-i="' + p[1] + '">Done</button></li>';
      }).join("") + "</ul>";
    }
    h += '<form class="park-form" data-park><input class="field" name="t" maxlength="500" autocomplete="off" placeholder="Park a thought" aria-label="Park a thought"><button class="btn" type="submit">Park</button></form></section>';
    var shown = 0;
    LESSONS.forEach(function (l) {
      var marks = state.marks[l.id] || [], note = state.notes[l.id] || "";
      if (!marks.length && !note) return;
      if (q && !hit(l.title) && !hit(note) && !marks.some(hit)) return;
      shown++;
      h += '<section class="instrument nb-lesson"><div class="section-head"><span class="label">Lesson ' + (LESSONS.indexOf(l) + 1) + " · " + esc(l.part.title) + "</span>" +
        '<h2><a href="#/lesson/' + l.id + '">' + esc(l.title) + " ›</a></h2></div>";
      if (marks.length) {
        h += '<ul class="marks">' + marks.map(function (m, i) {
          return "<li><q>" + esc(m) + '</q><button type="button" class="btn btn-quiet" data-act="unmark" data-lesson="' + l.id + '" data-i="' + i + '" aria-label="Remove highlight">Remove</button></li>';
        }).join("") + "</ul>";
      }
      h += '<label class="notes"><span class="label">Your notes</span><textarea data-note="' + l.id + '" rows="4">' + esc(note) + "</textarea></label></section>";
    });
    if (!shown && !Object.keys(state.notes).length && !Object.keys(state.marks).length) {
      h += '<section class="instrument"><div class="empty"><span class="label">No highlights or notes yet</span>' +
        "<p>Open a lesson, select a sentence worth keeping and press Highlight. Your notes box is under each lesson.</p>" +
        '<a class="btn" href="#/syllabus">Open the syllabus</a></div></section>';
    } else if (!shown) {
      h += '<section class="instrument"><div class="empty"><span class="label">Nothing matches</span><p>No lesson notes or highlights contain that.</p></div></section>';
    }
    box.innerHTML = h;
  }
  // After the server's copy arrives: update notes in place, unless being typed in.
  function refreshNotebook() {
    Array.prototype.forEach.call(document.querySelectorAll("textarea[data-note]"), function (t) {
      if (t !== document.activeElement) t.value = state.notes[t.dataset.note] || "";
    });
    if (route === "notes") renderNotebook();
    if (route && route.indexOf("lesson/") === 0) repaintReading(route.slice(7));
  }

  // ---- Highlights. Stored as the selected text, not as positions, so they
  // survive a lesson being edited; one whose text is gone stays in Notes.
  // Matching ignores whitespace, because a selection's text and the page's
  // text differ in line breaks between paragraphs and list items. ----
  function squeeze(t) { return t.replace(/\s+/g, ""); }
  // Case too: a selection's text is what's rendered, so a label that CSS
  // uppercases comes back as "FROM PHP" while the page holds "From PHP".
  function fold(t) { return squeeze(t).split("").map(function (c) { var l = c.toLowerCase(); return l.length === 1 ? l : c; }).join(""); }
  function applyMarks(id) {
    var box = document.getElementById("reading"), marks = state.marks[id] || [];
    if (!box) return;
    marks.forEach(function (m, idx) {
      var walk = document.createTreeWalker(box, NodeFilter.SHOW_TEXT), flat = "", at = [], n;
      while ((n = walk.nextNode())) {
        var v = n.nodeValue;
        for (var i = 0; i < v.length; i++) {
          if (/\s/.test(v[i])) continue;
          var c = v[i].toLowerCase(); flat += c.length === 1 ? c : v[i]; at.push([n, i]);
        }
      }
      var want = fold(m), pos = want ? flat.indexOf(want) : -1;
      if (pos < 0) return;
      var segs = [];
      for (var k = pos; k < pos + want.length; k++) {
        var last = segs[segs.length - 1];
        if (last && last.node === at[k][0]) last.b = at[k][1]; else segs.push({ node: at[k][0], a: at[k][1], b: at[k][1] });
      }
      segs.forEach(function (sg) {
        var r = document.createRange(), el = document.createElement("mark");
        r.setStart(sg.node, sg.a); r.setEnd(sg.node, sg.b + 1);
        el.dataset.mark = String(idx);
        try { r.surroundContents(el); } catch (e) {}
      });
    });
  }
  function repaintReading(id) {
    var box = document.getElementById("reading");
    if (box && lessonCache[id] && route === "lesson/" + id) { box.innerHTML = lessonCache[id]; applyMarks(id); }
  }
  function changeMarks(id, fn) {
    var list = (state.marks[id] || []).slice();
    fn(list);
    if (list.length) state.marks[id] = list; else delete state.marks[id];
    queueSave(); updateCounts();
  }

  // The highlight button. On a phone, tapping it can clear the selection
  // before the tap lands, so the last selection is kept for a moment.
  var lastSel = null, unmarkAt = null, selHide = null;
  function showSelbar(text) {
    clearTimeout(selHide);
    var bar = document.getElementById("selbar");
    document.getElementById("selbar-btn").textContent = text;
    bar.hidden = false;
  }
  function hideSelbar() { var bar = document.getElementById("selbar"); if (bar) bar.hidden = true; unmarkAt = null; }
  document.addEventListener("selectionchange", function () {
    var box = document.getElementById("reading"), sel = window.getSelection();
    if (box && route && route.indexOf("lesson/") === 0 && sel && !sel.isCollapsed && sel.rangeCount &&
        box.contains(sel.getRangeAt(0).commonAncestorContainer)) {
      var t = sel.toString().trim();
      if (squeeze(t).length >= 3 && t.length <= 1000) { lastSel = { t: t, id: route.slice(7), at: Date.now() }; unmarkAt = null; showSelbar("Highlight"); return; }
    }
    if (unmarkAt) return;
    clearTimeout(selHide);
    selHide = setTimeout(hideSelbar, 400);
  });
  function selbarAct() {
    if (unmarkAt) {
      var u = unmarkAt;
      changeMarks(u.id, function (list) { list.splice(u.i, 1); });
      repaintReading(u.id);
    } else if (lastSel && Date.now() - lastSel.at < 5000) {
      var s = lastSel;
      if ((state.marks[s.id] || []).length >= 200) toast("Full", "200 highlights is the limit per lesson");
      else changeMarks(s.id, function (list) { if (list.indexOf(s.t) < 0) list.push(s.t); });
      try { window.getSelection().removeAllRanges(); } catch (e) {}
      repaintReading(s.id);
    }
    lastSel = null; hideSelbar();
  }

  // One listener for every button with a data-act, wherever it is.
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (t.closest && t.closest("#selbar-btn")) { selbarAct(); return; }
    var mk = t.closest && t.closest("#reading mark[data-mark]");
    if (mk && route && route.indexOf("lesson/") === 0 && window.getSelection().isCollapsed) {
      unmarkAt = { id: route.slice(7), i: +mk.dataset.mark }; showSelbar("Remove highlight"); return;
    }
    if (unmarkAt) hideSelbar();
    var b = t.closest && t.closest("[data-act]"); if (!b) return;
    var act = b.dataset.act;
    if (act === "focus-on") setFocus(true);
    else if (act === "focus-off") setFocus(false);
    else if (act === "start") startBlock(+b.dataset.len || 25);
    else if (act === "pause") pauseBlock();
    else if (act === "resume") resumeBlock();
    else if (act === "stop") stopBlock();
    else if (act === "unpark") { state.later.splice(+b.dataset.i, 1); queueSave(); updateCounts(); renderNotebook(); }
    else if (act === "unmark") { changeMarks(b.dataset.lesson, function (list) { list.splice(+b.dataset.i, 1); }); renderNotebook(); }
  });
  // Keep the selection when the button is pressed with a mouse.
  document.addEventListener("mousedown", function (ev) { if (ev.target.closest && ev.target.closest("#selbar")) ev.preventDefault(); });
  document.addEventListener("submit", function (ev) {
    var f = ev.target; if (!f.hasAttribute || !f.hasAttribute("data-park")) return;
    ev.preventDefault();
    if (park(f.elements.t.value)) { f.elements.t.value = ""; if (route === "notes") renderNotebook(); }
  });
  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.id === "nb-q") { renderNotebook(); return; }
    if (!t.dataset || !t.dataset.note) return;
    var v = t.value.slice(0, 20000);
    if (v.trim()) state.notes[t.dataset.note] = v; else delete state.notes[t.dataset.note];
    queueSave();
    var nn = notebookCount(); setText("tab-notes", nn ? String(nn) : "");
  });

  // ---- Routing ----
  //   #/plan  #/plan/<item>  #/syllabus  #/lesson/<id>[/check]  #/drills  #/drill/<id>  #/review  #/notes  #/record
  function renderView() {
    var hash = location.hash.replace(/^#\/?/, "") || "plan";
    var m = /^lesson\/([a-z0-9-]+)(\/check)?$/.exec(hash), focus = /^plan\/([a-z0-9-]+)$/.exec(hash), dr = /^drill\/([a-z0-9]+)$/.exec(hash);
    if (m && !BY_ID[m[1]]) { m = null; hash = "syllabus"; }
    if (focus) hash = "plan";
    if (!m && !dr && ["plan", "syllabus", "record", "drills", "review", "notes"].indexOf(hash) < 0) hash = "plan";
    if (route === "plan") planScroll = window.scrollY;
    if (route && route.indexOf("drill/") === 0) stopClock();
    route = m ? "lesson/" + m[1] : dr ? "drill/" + dr[1] : hash;
    document.body.dataset.view = m || dr || hash === "review" ? "detail" : hash;
    var view = document.getElementById("view");
    var tab = m ? "syllabus" : dr ? "drills" : hash === "review" ? "plan" : hash;
    view.innerHTML = m ? lessonHtml(BY_ID[m[1]]) : dr ? drillHtml(dr[1]) :
      hash === "syllabus" ? syllabusHtml() : hash === "record" ? recordHtml() : hash === "drills" ? drillsHtml() : hash === "review" ? reviewHtml() :
      hash === "notes" ? notesHtml() : planHtml();
    // In focus mode the tabs are gone, so every other view ends with the next step.
    if (hash !== "plan" || m || dr) view.insertAdjacentHTML("beforeend", '<div class="next-box focus-only" data-next></div>');
    hideSelbar();
    Array.prototype.forEach.call(document.querySelectorAll(".tabs a"), function (a) {
      if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    updateCounts();
    if (m) {
      loadLesson(BY_ID[m[1]]); renderQuiz(BY_ID[m[1]]);
      if (m[2]) document.getElementById("check").scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);
    } else if (dr) { renderDrill(dr[1]); window.scrollTo(0, 0); }
    else if (hash === "drills") { renderDrillList(); window.scrollTo(0, 0); }
    else if (hash === "review") { reviewRun = {}; renderReview(); window.scrollTo(0, 0); }
    else if (hash === "notes") { renderNotebook(); window.scrollTo(0, 0); }
    else if (focus) {
      var row = document.querySelector('[data-item="' + focus[1] + '"]');
      if (row) { row.scrollIntoView({ block: "center" }); row.classList.add("flash"); setTimeout(function () { row.classList.remove("flash"); }, 1600); }
    } else window.scrollTo(0, hash === "plan" ? planScroll : 0);
  }

  function setText(id, text) { var el = document.getElementById(id); if (el) el.textContent = text; }
  function updateCounts() {
    var s = score(), r = s.rank, nextR = RANKS[r + 1];
    setText("rank", RANKS[r][1]);
    setText("xp", num(s.xp) + " XP" + (nextR ? " · next at " + num(nextR[0]) : " · top rank"));
    document.getElementById("today").innerHTML = num(s.today) + " <small>XP</small>";
    setText("goal", s.today >= GOAL ? "Goal met" : "Goal " + GOAL);
    var lit = Math.min(30, Math.floor(30 * s.today / GOAL));
    Array.prototype.forEach.call(document.querySelectorAll(".dial line"), function (ln, i) { ln.classList.toggle("on", i < lit); });
    document.querySelector(".dial").classList.toggle("full", s.today >= GOAL);
    document.getElementById("streak").innerHTML = s.streak + " <small>d</small>";
    setText("best", "Longest " + s.longest + " d");
    // 20 segments of progress through the current rank.
    var lo = RANKS[r][0], hi = nextR ? nextR[0] : s.max, frac = nextR ? (s.xp - lo) / (hi - lo) : 1;
    Array.prototype.forEach.call(document.querySelectorAll("#ticks i"), function (el, i) { el.className = i < Math.floor(frac * 20) ? "on" : ""; });
    setText("tab-plan", s.planDone + "/" + allIds().length);
    setText("tab-syl", s.read + "/" + LESSONS.length);
    setText("tab-drl", drills ? s.drillsTried + "/" + drills.length : "");
    setText("tab-rec", s.badges.length + "/" + BADGES.length);
    var nn = notebookCount();
    setText("tab-notes", nn ? String(nn) : "");
    Array.prototype.forEach.call(document.querySelectorAll("[data-next]"), function (el) {
      var nh = nextHtml(); if (el._h !== nh) { el.innerHTML = nh; el._h = nh; }
    });
    setText("fb-sub", fzSub(s));
    PLAN.forEach(function (d) {
      var el = document.getElementById("count-" + d.id); if (!el) return;
      var all = dayItems(d), k = all.filter(function (i) { return state.done[i.id]; }).length;
      el.textContent = k === all.length ? "Done" : k + " / " + all.length;
      el.dataset.full = String(k === all.length);
    });
    PARTS.forEach(function (p) {
      var el = document.getElementById("pcount-" + p.n); if (!el) return;
      var k = p.lessons.filter(function (l) { return state.done[readId(l.id)]; }).length;
      el.textContent = k === p.lessons.length ? "Read" : k + " / " + p.lessons.length + " read";
      el.dataset.full = String(k === p.lessons.length);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-lesson]"), function (a) {
      a.dataset.read = String(!!state.done[readId(a.dataset.lesson)]);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".qscore"), function (el) {
      var q = state.quiz[el.dataset.q];
      el.textContent = q ? q.best + "/" + q.of + " · " : "";
      el.dataset.pass = String(passed(el.dataset.q));
    });
  }

  function updateCountdown() {
    var el = document.getElementById("countdown"); if (!el || !TARGET) return;
    var ms = TARGET.at.getTime() - Date.now();
    if (ms <= 0) { el.textContent = "Passed"; return; }
    var hrs = Math.floor(ms / 3600000), d = Math.floor(hrs / 24);
    el.innerHTML = (d > 0 ? d + " <small>d</small> " : "") + (hrs % 24) + " <small>h</small>";
  }

  // ---- Status: the dot carries the state, the stamp says it plainly. ----
  function setStatus(kind, text) {
    var s = document.getElementById("status");
    s.dataset.state = kind;
    document.getElementById("status-text").textContent = text;
    // Grey out the accents only when the server is out of reach.
    if (kind === "local") document.documentElement.dataset.connection = "offline";
    else delete document.documentElement.dataset.connection;
  }

  // ---- Server sync ----
  function api(method, body) {
    return fetch("/state", {
      method: method, cache: "no-store",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  }

  function unreachable(err) {
    var kept = writeLocal();
    if (err && err.status) setStatus("unsent", "Server refused the save (" + err.status + ") · " + (kept ? "kept in this browser" : "not saved"));
    else setStatus("local", kept ? "Server unreachable · progress kept in this browser" : "Server unreachable · progress will reset on reload");
  }

  function push() {
    if (inflight) return;
    inflight = true;
    var mine = seq;
    setStatus("syncing", "Saving");
    api("PUT", payload()).then(function () {
      inflight = false;
      if (mine !== seq) { push(); return; }   // changed again while saving
      dirty = false; writeLocal();
      setStatus("ok", "Saved on server · " + hhmm(new Date()));
    }).catch(function (e) { inflight = false; unreachable(e); });
  }

  function queueSave() {
    if (DEMO) { writeLocal(); setStatus("ok", "Saved in this browser · " + hhmm(new Date())); return; }
    dirty = true; seq++;
    writeLocal();
    setStatus("unsent", "Unsent");
    clearTimeout(timer); timer = setTimeout(push, 600);
  }

  document.addEventListener("change", function (ev) {
    var t = ev.target; if (!t || !t.dataset || !t.dataset.id) return;
    var id = t.dataset.id, on = t.checked;
    var label = id.indexOf("read-") === 0 ? "Read · " + (BY_ID[id.slice(5)] || {}).title : DRILL_ID.test(id) ? "Found it" : "Ticked";
    change(function () { if (on) state.done[id] = true; else delete state.done[id]; }, label);
    // The same id can show twice (a lesson's plan items); keep both in step.
    Array.prototype.forEach.call(document.querySelectorAll('input[data-id="' + id + '"]'), function (cb) { cb.checked = on; });
  });

  // Retry unsent changes when the network or the tab comes back, and every 30 s.
  function retry() { if (dirty && !DEMO) push(); }
  window.addEventListener("online", retry);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { retry(); updateCounts(); } });
  setInterval(retry, 30000);
  setInterval(updateCountdown, 60000);

  // ---- Load: local copy first (instant), then the server's. ----
  var local = readLocal();
  if (local) { adopt(local); dirty = !!local.dirty; }
  renderShell();
  setFocus(fz.on, true);
  renderView();
  paintFocus(true);
  setInterval(tickFocus, 1000);
  window.addEventListener("hashchange", renderView);
  loadDrills().catch(function () {});
  if (DEMO) setStatus("ok", "Demo · progress stays in this browser");
  else api("GET").then(function (srv) {
    if (dirty) { push(); return; }              // local has changes the server never got
    adopt(srv);
    writeLocal();
    // Update in place rather than re-rendering, so a lesson being read
    // isn't reloaded and the scroll position stays put.
    Array.prototype.forEach.call(document.querySelectorAll("input[data-id]"), function (cb) { cb.checked = !!state.done[cb.dataset.id]; });
    refreshNotebook();
    updateCounts();
    var at = srv.updated_at ? " · last change " + hhmm(new Date(srv.updated_at)) : "";
    setStatus("ok", "Synced with server" + at);
  }).catch(unreachable);

  // Offline: cache the page, lessons and questions. Served over http(s) only.
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
